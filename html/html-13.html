<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .card {
            flex: 1;
            padding: 30px;
            background-color: lightblue;
            border: 2px solid blue;
            text-align: center;
        }

        /* Tablet and Mobile */
        @media (max-width: 768px) {

            .container {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }

            header {
                padding: 20px;
            }
        }

        /* Small Mobile */
        @media (max-width: 480px) {

            header h1 {
                font-size: 24px;
            }

            .container {
                padding: 15px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Webpage</h1>
        <p>Resize the browser window to see the effect.</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>HTML creates webpage structure.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>CSS styles the webpage.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript adds functionality.</p>
        </div>

    </div>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
