<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            text-align: center;
            color: darkblue;
        }

        .internal {
            color: green;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Internal and External CSS</h1>

    <p class="internal">
        This paragraph is styled using Internal CSS.
    </p>

    <p class="external">
        This paragraph is styled using External CSS.
    </p>

    <div class="box">
        This box demonstrates external CSS styling.
    </div>

    <br>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
