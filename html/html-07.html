<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Iframe</title>
</head>

<body>

    <h1>Using Iframe in HTML</h1>

    <p>
        An iframe allows another webpage to be displayed inside the current webpage.
    </p>

    <h2>Embedded Website</h2>

    <iframe src="https://www.example.com" width="700" height="400" title="Example Website">
    </iframe>

    <h2>Embedded YouTube Video</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube Video"
        allowfullscreen>
    </iframe>

    <br><br>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
