<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Properties</title>

    <style>
        /* Element Selector */
        h1 {
            color: darkblue;
            font-family: Arial, sans-serif;
        }

        /* Class Selector */
        .paragraph {
            color: green;
            font-size: 18px;
        }

        /* ID Selector */
        #box {
            background-color: lightblue;
            border: 3px solid blue;
            margin: 30px;
            padding: 25px;
            width: 300px;
        }

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors and Properties</h1>

    <p class="paragraph">
        This paragraph demonstrates colors and fonts.
    </p>

    <div id="box">
        <h2>CSS Box</h2>

        <p>
            This box demonstrates:
        </p>

        <ul>
            <li>Margin</li>
            <li>Padding</li>
            <li>Border</li>
            <li>Background Color</li>
            <li>Font Styling</li>
        </ul>
    </div>

    <br>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
