<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th,
        td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Student Marks Table</h1>

    <table>
        <tr>
            <th colspan="4">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Manvitha</td>
            <td>101</td>
            <td>Python</td>
            <td>90</td>
        </tr>

        <tr>
            <td rowspan="2">Rahul</td>
            <td>102</td>
            <td>HTML</td>
            <td>85</td>
        </tr>

        <tr>
            <td>102</td>
            <td>CSS</td>
            <td>88</td>
        </tr>
    </table>

    <br>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
