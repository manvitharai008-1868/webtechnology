<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video</title>
</head>

<body>

    <h1>HTML Multimedia</h1>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <p>
        Place an audio file named <b>audio.mp3</b> inside the html folder
        to play your own audio.
    </p>

    <h2>Video</h2>

    <video width="500" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <p>
        Place a video file named <b>video.mp4</b> inside the html folder
        to play your own video.
    </p>

    <br>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
