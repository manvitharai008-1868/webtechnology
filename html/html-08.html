<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>

    <style>
        header,
        nav,
        section,
        article,
        footer {
            padding: 20px;
            margin: 10px;
            border: 1px solid black;
        }

        header {
            background-color: lightblue;
        }

        nav {
            background-color: lightgray;
        }

        section {
            background-color: lightgreen;
        }

        article {
            background-color: #f5f5f5;
        }

        footer {
            background-color: lightyellow;
        }

        a {
            margin-right: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Webpage</h1>
        <p>Welcome to my website</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>About HTML</h2>

        <article>
            <h3>What is HTML?</h3>
            <p>
                HTML stands for HyperText Markup Language.
                It is used to create the structure of webpages.
            </p>
        </article>
    </section>

    <footer>
        <p>&copy; 2026 My Webpage</p>
    </footer>

    <br>

    <a href="../index.html">Home</a> |
    <a href="index.html">Back to HTML Programs</a>

</body>

</html>
