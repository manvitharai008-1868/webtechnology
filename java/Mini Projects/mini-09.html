<!DOCTYPE html>
<html>

<head>
    <title>Tic-Tac-Toe</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            width: 240px;
            margin: 30px auto;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>Tic-Tac-Toe</h1>

    <div class="board" id="board"></div>

    <h2 id="message">Player X</h2>

    <button onclick="resetGame()">Reset</button>

    <script>

        let board = ["", "", "", "", "", "", "", "", ""];
        let player = "X";

        function createBoard() {

            let boardElement = document.getElementById("board");

            boardElement.innerHTML = "";

            board.forEach(function (value, index) {

                let button = document.createElement("button");

                button.innerHTML = value;

                button.onclick = function () {
                    play(index);
                };

                boardElement.appendChild(button);
            });
        }

        function play(index) {

            if (board[index] !== "") return;

            board[index] = player;

            if (checkWinner()) {

                document.getElementById("message").innerHTML =
                    "Player " + player + " wins!";

                createBoard();

                return;
            }

            player = player === "X" ? "O" : "X";

            document.getElementById("message").innerHTML =
                "Player " + player;

            createBoard();
        }

        function checkWinner() {

            let combinations = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            return combinations.some(function (c) {

                return board[c[0]] &&
                    board[c[0]] === board[c[1]] &&
                    board[c[1]] === board[c[2]];
            });
        }

        function resetGame() {

            board = ["", "", "", "", "", "", "", "", ""];

            player = "X";

            document.getElementById("message").innerHTML =
                "Player X";

            createBoard();
        }

        createBoard();

    </script>

</body>

</html>
