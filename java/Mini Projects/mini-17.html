<!DOCTYPE html>
<html>

<head>

    <title>Interactive Portfolio</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 30px;
        }

        section {
            padding: 30px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        #skills {
            display: none;
        }
    </style>

</head>

<body>

    <header>

        <h1>My Portfolio</h1>

        <p>Python Developer | Software Engineer</p>

    </header>

    <section>

        <h2>About Me</h2>

        <p>
            Welcome to my interactive portfolio.
        </p>

        <button onclick="showSkills()">
            Show My Skills
        </button>

        <div id="skills">

            <h2>Skills</h2>

            <p>Python</p>
            <p>HTML</p>
            <p>CSS</p>
            <p>JavaScript</p>
            <p>SQL</p>

        </div>

    </section>

    <script>

        function showSkills() {

            let skills = document.getElementById("skills");

            if (skills.style.display === "none") {

                skills.style.display = "block";

            } else {

                skills.style.display = "none";

            }
        }

    </script>

</body>

</html>
