<!DOCTYPE html>
<html>

<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        input {
            padding: 12px;
            width: 250px;
        }

        button {
            padding: 12px;
            cursor: pointer;
        }

        li {
            list-style: none;
            background: #eee;
            margin: 10px auto;
            padding: 12px;
            max-width: 400px;
        }

        li button {
            float: right;
            padding: 5px;
        }
    </style>
</head>

<body>

    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter task">

    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>

    <script>

        function addTask() {

            let task = document.getElementById("task").value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.innerHTML =
                task +
                ' <button onclick="this.parentElement.remove()">Delete</button>';

            document.getElementById("list").appendChild(li);

            document.getElementById("task").value = "";
        }

    </script>

</body>

</html>
