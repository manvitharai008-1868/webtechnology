<!DOCTYPE html>
<html>

<head>
    <title>setTimeout</title>
</head>

<body>

    <h2>setTimeout Example</h2>

    <button onclick="startTimer()">Start</button>

    <p id="result"></p>

    <script>
        function startTimer() {

            document.getElementById("result").innerText =
                "Wait for 3 seconds...";

            setTimeout(function () {

                document.getElementById("result").innerText =
                    "3 seconds completed!";

            }, 3000);
        }
    </script>

</body>

</html>
