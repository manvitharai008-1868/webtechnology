<!DOCTYPE html>
<html>

<head>
    <title>Redirect</title>
</head>

<body>

    <h2>Page Redirect</h2>

    <button onclick="redirectPage()">
        Open Google
    </button>

    <script>
        function redirectPage() {

            window.location.href = "https://www.google.com";
        }
    </script>

</body>

</html>
