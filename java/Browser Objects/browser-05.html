<!DOCTYPE html>
<html>

<head>
    <title>Digital Clock</title>
</head>

<body>

    <h2>Digital Clock</h2>

    <h1 id="clock"></h1>

    <script>
        function showTime() {

            let now = new Date();

            document.getElementById("clock").innerText =
                now.toLocaleTimeString();
        }

        setInterval(showTime, 1000);

        showTime();
    </script>

</body>

</html>
