<!DOCTYPE html>
<html>

<head>
    <title>Countdown Timer</title>
</head>

<body>

    <h2>Countdown</h2>

    <h1 id="count">10</h1>

    <script>
        let number = 10;

        let timer = setInterval(function () {

            document.getElementById("count").innerText = number;

            number--;

            if (number < 0) {

                clearInterval(timer);

                document.getElementById("count").innerText =
                    "Time's Up!";
            }

        }, 1000);
    </script>

</body>

</html>
