<!DOCTYPE html>
<html>

<head>
    <title>Persistent Cart</title>
</head>

<body>

    <h2>Persistent Shopping Cart</h2>

    <button onclick="addItem('Laptop')">
        Add Laptop
    </button>

    <button onclick="addItem('Phone')">
        Add Phone
    </button>

    <button onclick="clearCart()">
        Clear Cart
    </button>

    <h3>Cart</h3>

    <ul id="cart"></ul>

    <script>
        function addItem(item) {

            let cart = JSON.parse(
                localStorage.getItem("cart") || "[]"
            );

            cart.push(item);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();
        }

        function displayCart() {

            let cart = JSON.parse(
                localStorage.getItem("cart") || "[]"
            );

            let list = document.getElementById("cart");

            list.innerHTML = "";

            cart.forEach(function (item) {

                let li = document.createElement("li");

                li.innerText = item;

                list.appendChild(li);
            });
        }

        function clearCart() {

            localStorage.removeItem("cart");

            displayCart();
        }

        displayCart();
    </script>

</body>

</html>
