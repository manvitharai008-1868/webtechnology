<!DOCTYPE html>
<html>

<head>
    <title>Clear localStorage</title>
</head>

<body>

    <h2>Clear localStorage</h2>

    <button onclick="clearStorage()">Clear All</button>

    <p id="result"></p>

    <script>
        function clearStorage() {

            localStorage.clear();

            document.getElementById("result").innerText =
                "All localStorage data cleared.";
        }
    </script>

</body>

</html>
