<!DOCTYPE html>
<html>

<head>
    <title>Delete localStorage</title>
</head>

<body>

    <h2>Delete Username</h2>

    <button onclick="deleteName()">Delete</button>

    <p id="result"></p>

    <script>
        function deleteName() {

            localStorage.removeItem("username");

            document.getElementById("result").innerText =
                "Username deleted.";
        }
    </script>

</body>

</html>
