<!DOCTYPE html>
<html>

<head>
    <title>Image Slideshow</title>
</head>

<body>

    <h1>Image Slideshow</h1>

    <img id="slide" src="https://via.placeholder.com/400x250?text=Image+1" width="400">

    <br><br>

    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>

    <script>

        let images = [
            "https://via.placeholder.com/400x250?text=Image+1",
            "https://via.placeholder.com/400x250?text=Image+2",
            "https://via.placeholder.com/400x250?text=Image+3"
        ];

        let current = 0;

        function showImage() {
            document.getElementById("slide").src = images[current];
        }

        function next() {

            current++;

            if (current >= images.length) {
                current = 0;
            }

            showImage();
        }

        function previous() {

            current--;

            if (current < 0) {
                current = images.length - 1;
            }

            showImage();
        }

    </script>

</body>

</html>
