<!DOCTYPE html>
<html>

<head>
    <title>Onclick Event</title>
</head>

<body>

    <h1>Onclick Event</h1>

    <button onclick="showMessage()">Click Me</button>

    <p id="result"></p>

    <script>
        function showMessage() {
            document.getElementById("result").innerHTML =
                "Button was clicked!";
        }
    </script>

</body>

</html>
