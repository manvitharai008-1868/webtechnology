<!DOCTYPE html>
<html>

<head>
    <title>Double Click Event</title>
</head>

<body>

    <h1>Double Click Event</h1>

    <button ondblclick="showMessage()">Double Click Me</button>

    <p id="result"></p>

    <script>
        function showMessage() {
            document.getElementById("result").innerHTML =
                "Button was double-clicked!";
        }
    </script>

</body>

</html>
