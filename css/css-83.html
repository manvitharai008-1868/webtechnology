<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
            background: #f5f5f5;
        }

        .form {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="form">

        <h2>Forgot Password?</h2>

        <p>Enter your email to receive a reset link.</p>

        <input type="email" placeholder="Enter your email">

        <button>Send Reset Link</button>

    </div>

</body>

</html>
