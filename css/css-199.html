<!DOCTYPE html>
<html>

<head>
    <title>Pricing Comparison</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        table {
            max-width: 900px;
            margin: auto;
            width: 100%;
            border-collapse: collapse;
            background: white
        }

        th,
        td {
            padding: 16px;
            border: 1px solid #ddd;
            text-align: center
        }

        th {
            background: #2563eb;
            color: white
        }
    </style>
</head>

<body>
    <h1 style="text-align:center">Pricing Plan Comparison</h1>
    <table>
        <tr>
            <th>Feature</th>
            <th>Basic</th>
            <th>Pro</th>
            <th>Enterprise</th>
        </tr>
        <tr>
            <td>Users</td>
            <td>5</td>
            <td>20</td>
            <td>Unlimited</td>
        </tr>
        <tr>
            <td>Storage</td>
            <td>10 GB</td>
            <td>100 GB</td>
            <td>1 TB</td>
        </tr>
        <tr>
            <td>Support</td>
            <td>Basic</td>
            <td>Priority</td>
            <td>24/7</td>
        </tr>
        <tr>
            <td>Analytics</td>
            <td>✓</td>
            <td>✓</td>
            <td>✓</td>
        </tr>
    </table>
</body>

</html>
