<!DOCTYPE html>
<html>

<head>
    <title>Responsive Login</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 30px
        }

        .login {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="login">
        <h1>Login</h1>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Login</button>
        <p>Forgot password?</p>
    </div>
</body>

</html>
