<!DOCTYPE html>
<html>

<head>
    <title>SaaS Usage Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #0002;
        }

        h2 {
            color: #4f46e5;
        }

        @media(max-width:700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>SaaS Usage Analytics</h1>

    <div class="dashboard">

        <div class="card">
            <h3>Active Seats</h3>
            <h2>8,420</h2>
        </div>

        <div class="card">
            <h3>API Calls</h3>
            <h2>2.4M</h2>
        </div>

        <div class="card">
            <h3>Storage</h3>
            <h2>684 GB</h2>
        </div>

        <div class="card">
            <h3>Feature Usage</h3>
            <h2>76%</h2>
        </div>

    </div>

</body>

</html>
