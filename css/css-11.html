<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Width and Height</title>

    <style>
        .box {
            width: 300px;
            height: 150px;

            min-width: 200px;
            max-width: 500px;

            min-height: 100px;
            max-height: 250px;

            background-color: lightblue;

            border: 3px solid blue;

            padding: 20px;

            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Width and Height Properties</h1>

    <div class="box">

        <p>
            This box demonstrates width, height,
            min-width, max-width, min-height
            and max-height.
        </p>

    </div>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
