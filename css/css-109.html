<!DOCTYPE html>
<html>

<head>
    <title>Heatmap Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-width: 600px;
        }

        .box {
            aspect-ratio: 1;
            background: #dbeafe;
            border-radius: 4px;
        }

        .medium {
            background: #60a5fa;
        }

        .high {
            background: #2563eb;
        }

        .very-high {
            background: #1e40af;
        }
    </style>
</head>

<body>

    <h1>Heatmap Analytics</h1>

    <div class="heatmap">

        <script>
            for (let i = 1; i <= 70; i++) {
                let type = "";

                if (i % 7 === 0)
                    type = "very-high";
                else if (i % 4 === 0)
                    type = "high";
                else if (i % 3 === 0)
                    type = "medium";

                document.write(`<div class="box ${type}"></div>`);
            }
        </script>

    </div>

</body>

</html>
