<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Display</title>

    <style>
        .block {
            display: block;
            background-color: lightblue;
            padding: 10px;
        }

        .inline {
            display: inline;
            background-color: lightgreen;
        }

        .inline-block {
            display: inline-block;
            background-color: lightyellow;
            padding: 20px;
            margin: 10px;
        }

        .flex {
            display: flex;
            gap: 10px;
        }

        .flex div {
            background-color: lightpink;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .grid div {
            background-color: lightgray;
            padding: 20px;
        }

        .none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS Display Properties</h1>

    <h2>Block</h2>

    <div class="block">Block Element</div>

    <h2>Inline</h2>

    <span class="inline">Inline Element</span>

    <h2>Inline Block</h2>

    <span class="inline-block">Box 1</span>
    <span class="inline-block">Box 2</span>

    <h2>Flex</h2>

    <div class="flex">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
    </div>

    <h2>Grid</h2>

    <div class="grid">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
    </div>

    <p class="none">
        This element uses display:none.
    </p>

    <br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
