<!DOCTYPE html>
<html>

<head>
    <title>Badges, Labels, Tags and Chips</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .badge {
            background: #2563eb;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .label {
            background: #eee;
            padding: 8px 14px;
            border-radius: 5px;
        }

        .tag {
            background: #e0f2fe;
            color: #0369a1;
            padding: 7px 12px;
            border-radius: 15px;
        }

        .chip {
            display: inline-block;
            background: #f3f4f6;
            padding: 8px 15px;
            border-radius: 20px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h2>Badges</h2>
    <span class="badge">New</span>
    <span class="badge">Featured</span>

    <h2>Labels</h2>
    <span class="label">Important</span>

    <h2>Tags</h2>
    <span class="tag">HTML</span>
    <span class="tag">CSS</span>

    <h2>Chips</h2>
    <span class="chip">Python</span>
    <span class="chip">JavaScript</span>
    <span class="chip">Web Development</span>

</body>

</html>
