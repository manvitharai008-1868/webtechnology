<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visibility and Opacity</title>

    <style>
        .visible {
            background-color: lightgreen;
            padding: 20px;
        }

        .hidden {
            background-color: lightblue;
            padding: 20px;

            visibility: hidden;
        }

        .transparent {
            background-color: orange;
            padding: 20px;

            opacity: 0.4;
        }
    </style>
</head>

<body>

    <h1>CSS Visibility and Opacity</h1>

    <div class="visible">
        This element is visible.
    </div>

    <br>

    <div class="hidden">
        This element is hidden using visibility:hidden.
    </div>

    <br>

    <div class="transparent">
        This element has 40% opacity.
    </div>

    <br>

    <p>
        The hidden element still occupies space because
        visibility:hidden is used.
    </p>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
