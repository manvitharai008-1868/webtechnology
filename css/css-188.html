<!DOCTYPE html>
<html>

<head>
    <title>Organization Settings</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px;
        }

        .settings {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="settings">

        <h1>Organization Settings</h1>

        <label>Organization Name</label>
        <input type="text" value="My Organization">

        <label>Website</label>
        <input type="url" placeholder="https://example.com">

        <label>Description</label>
        <textarea rows="5" placeholder="Organization description"></textarea>

        <button>Save Settings</button>

    </div>

</body>

</html>
