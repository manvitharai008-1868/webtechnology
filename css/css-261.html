<!DOCTYPE html>
<html>

<head>
    <title>Billing Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .billing {
            max-width: 800px;
            margin: auto
        }

        .card {
            background: white;
            padding: 25px;
            margin: 15px 0;
            border-radius: 12px
        }

        .amount {
            font-size: 30px;
            font-weight: bold
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="billing">
        <h1>Billing Management</h1>
        <div class="card">
            <h2>Current Plan</h2>
            <div class="amount">₹999/month</div><button>Change Plan</button>
        </div>
        <div class="card">
            <h2>Next Payment</h2>
            <p>25 September 2026</p>
        </div>
        <div class="card">
            <h2>Payment Method</h2>
            <p>Visa •••• 4521</p><button>Update</button>
        </div>
    </div>
</body>

</html>
