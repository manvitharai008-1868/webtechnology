<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 135 - Natural Language Query</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 750px;
            margin: 80px auto;
            text-align: center;
            padding: 20px;
        }

        .query-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        input {
            width: 90%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Natural-Language Query</h1>

        <div class="query-box">

            <input type="text" placeholder="Ask a question in natural language...">

            <br>

            <button>Ask AI</button>

            <div class="answer">
                <h3>AI Answer</h3>
                <p>
                    The AI will understand the question and provide
                    an easy-to-understand answer.
                </p>
            </div>

        </div>

    </div>

</body>

</html>
