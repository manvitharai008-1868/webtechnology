<!DOCTYPE html>
<html>

<head>
    <title>Activity Feed</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .feed {
            width: 400px;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .activity {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .activity:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="feed">

        <h2>Activity Feed</h2>

        <div class="activity">
            <b>Manvitha</b> created a new project.
            <br>
            <small>10 minutes ago</small>
        </div>

        <div class="activity">
            <b>Rahul</b> updated the dashboard.
            <br>
            <small>30 minutes ago</small>
        </div>

        <div class="activity">
            <b>Ananya</b> completed a task.
            <br>
            <small>1 hour ago</small>
        </div>

    </div>

</body>

</html>
