<!DOCTYPE html>
<html>

<head>
    <title>ML Classification Result</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .result {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px #ddd;
        }

        .class-name {
            font-size: 40px;
            font-weight: bold;
            margin: 20px;
        }

        .confidence {
            background: #e5e7eb;
            height: 20px;
            border-radius: 20px;
            overflow: hidden;
        }

        .confidence div {
            width: 94%;
            height: 100%;
            background: #16a34a;
        }
    </style>
</head>

<body>

    <div class="result">

        <h1>Classification Result</h1>

        <p>Predicted Class</p>

        <div class="class-name">Positive</div>

        <p>Confidence: 94%</p>

        <div class="confidence">
            <div></div>
        </div>

    </div>

</body>

</html>
