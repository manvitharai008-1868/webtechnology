<!DOCTYPE html>
<html>

<head>
    <title>Financial Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #f0fdf4;
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #0002;
        }

        h2 {
            color: #15803d;
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Financial Analytics</h1>

    <div class="cards">

        <div class="card">
            <h3>Income</h3>
            <h2>₹38.4L</h2>
        </div>

        <div class="card">
            <h3>Expenses</h3>
            <h2>₹21.8L</h2>
        </div>

        <div class="card">
            <h3>Profit</h3>
            <h2>₹16.6L</h2>
        </div>

        <div class="card">
            <h3>Profit Margin</h3>
            <h2>43.2%</h2>
        </div>

    </div>

</body>

</html>
