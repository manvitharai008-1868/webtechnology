<!DOCTYPE html>
<html>

<head>
    <title>Avatars</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 5px;
        }

        .group {
            display: flex;
        }

        .group .avatar {
            margin-left: -10px;
            border: 3px solid white;
        }
    </style>
</head>

<body>

    <h2>User Avatar</h2>

    <div class="avatar">MR</div>

    <h2>Avatar Group</h2>

    <div class="group">
        <div class="avatar">MR</div>
        <div class="avatar">AS</div>
        <div class="avatar">RK</div>
        <div class="avatar">PK</div>
    </div>

</body>

</html>
