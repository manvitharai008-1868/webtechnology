<!DOCTYPE html>
<html>

<head>
    <title>Human in the Loop</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 30px;
        }

        .workflow {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .step {
            padding: 18px;
            margin: 10px 0;
            border-left: 5px solid #2563eb;
            background: #f8fafc;
        }

        .active {
            border-color: #16a34a;
        }
    </style>
</head>

<body>

    <div class="workflow">
        <h1>Human-in-the-Loop Workflow</h1>

        <div class="step">
            <strong>Step 1:</strong> AI analyzes the request
        </div>

        <div class="step active">
            <strong>Step 2:</strong> Human reviews the AI result
        </div>

        <div class="step">
            <strong>Step 3:</strong> AI performs the approved action
        </div>

        <div class="step">
            <strong>Step 4:</strong> Task completed
        </div>
    </div>

</body>

</html>
