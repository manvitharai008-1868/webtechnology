<!DOCTYPE html>
<html>

<head>
    <title>Payment Methods</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .box {
            max-width: 650px;
            margin: auto
        }

        .payment {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 3px 8px #ddd
        }

        button {
            padding: 9px 16px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Payment Methods</h1>
        <div class="payment">
            <h3>💳 Visa •••• 4521</h3>
            <p>Expires 08/28</p><button>Remove</button>
        </div>
        <div class="payment">
            <h3>💳 Mastercard •••• 7832</h3>
            <p>Expires 04/29</p><button>Remove</button>
        </div>
        <button>Add Payment Method</button>
    </div>
</body>

</html>
