<!DOCTYPE html>
<html>

<head>
    <title>Retention and Cohort Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Retention & Cohort Analytics</h1>

    <div class="box">

        <table>

            <tr>
                <th>Cohort</th>
                <th>Week 1</th>
                <th>Week 4</th>
                <th>Week 8</th>
            </tr>

            <tr>
                <td>January</td>
                <td>88%</td>
                <td>72%</td>
                <td>61%</td>
            </tr>

            <tr>
                <td>February</td>
                <td>91%</td>
                <td>75%</td>
                <td>64%</td>
            </tr>

            <tr>
                <td>March</td>
                <td>93%</td>
                <td>78%</td>
                <td>68%</td>
            </tr>

        </table>

    </div>

</body>

</html>
