<!DOCTYPE html>
<html>

<head>
    <title>Subscription Management</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 30px
        }

        .box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        .info {
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            margin: 5px
        }

        .cancel {
            background: #dc2626
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Subscription Management</h1>
        <div class="info">
            <h2>Pro Plan</h2>
            <p>₹999 / month</p>
            <p>Next billing date: 25 September 2026</p>
        </div>
        <button>Manage Plan</button>
        <button class="cancel">Cancel Subscription</button>
    </div>
</body>

</html>
