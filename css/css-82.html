<!DOCTYPE html>
<html>

<head>
    <title>Signup Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        form {
            width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <form>

        <h2>Create Account</h2>

        <input type="text" placeholder="Full Name">

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Sign Up</button>

    </form>

</body>

</html>
