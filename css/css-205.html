<!DOCTYPE html>
<html>

<head>
    <title>Invoice Details</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 30px
        }

        .invoice {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #ddd
        }

        .total {
            font-size: 24px;
            font-weight: bold
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="invoice">
        <h1>Invoice #INV001</h1>
        <p>Date: 20 September 2026</p>
        <div class="row"><span>Pro Plan</span><span>₹999</span></div>
        <div class="row"><span>Tax</span><span>₹180</span></div>
        <div class="row total"><span>Total</span><span>₹1179</span></div>
        <br>
        <button>Download Invoice</button>
    </div>
</body>

</html>
