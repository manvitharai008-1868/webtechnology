<!DOCTYPE html>
<html>

<head>
    <title>Two Factor Authentication</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .box {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px
        }

        input {
            padding: 12px;
            width: 80%;
            margin: 15px
        }

        button {
            padding: 12px 25px;
            background: #16a34a;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Two-Factor Authentication</h1>
        <p>Enter the 6-digit verification code.</p>
        <input type="text" placeholder="000000">
        <br>
        <button>Verify</button>
    </div>
</body>

</html>
