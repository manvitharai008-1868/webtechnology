<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 148 - AI Agent Profile</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .profile {
            max-width: 600px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px #ddd;
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .skill {
            padding: 8px 14px;
            background: #eee;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="avatar">AI</div>

        <h1>Research Agent</h1>

        <p>AI Agent for research and information analysis.</p>

        <h3>Capabilities</h3>

        <div class="skills">
            <span class="skill">Research</span>
            <span class="skill">Analysis</span>
            <span class="skill">Summarization</span>
        </div>

    </div>

</body>

</html>
