<!DOCTYPE html>
<html>

<head>
    <title>Bar Chart</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .chart {
            height: 300px;
            background: white;
            padding: 25px;
            display: flex;
            align-items: end;
            gap: 25px;
            border-radius: 15px;
        }

        .bar {
            flex: 1;
            background: #2563eb;
            border-radius: 8px 8px 0 0;
        }

        .bar1 {
            height: 45%;
        }

        .bar2 {
            height: 70%;
        }

        .bar3 {
            height: 55%;
        }

        .bar4 {
            height: 90%;
        }

        .bar5 {
            height: 65%;
        }
    </style>
</head>

<body>

    <h1>Bar Chart Analytics</h1>

    <div class="chart">

        <div class="bar bar1"></div>
        <div class="bar bar2"></div>
        <div class="bar bar3"></div>
        <div class="bar bar4"></div>
        <div class="bar bar5"></div>

    </div>

</body>

</html>
