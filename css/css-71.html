<!DOCTYPE html>
<html>

<head>
    <title>Command Palette</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 50px;
        }

        .palette {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #bbb;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .command {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .command:hover {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

    <div class="palette">

        <input type="text" placeholder="Search commands...">

        <div class="command">⌘ Create New Project</div>
        <div class="command">⌘ Open Dashboard</div>
        <div class="command">⌘ Settings</div>
        <div class="command">⌘ Logout</div>

    </div>

</body>

</html>
