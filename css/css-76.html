<!DOCTYPE html>
<html>

<head>
    <title>Loading State</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
            text-align: center;
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 5px solid #ddd;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h2>Loading...</h2>

    <div class="loader"></div>

    <p>Please wait while the page loads.</p>

</body>

</html>
