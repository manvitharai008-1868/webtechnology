<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 30px;
        }

        form {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <form>

        <h2>Student Registration</h2>

        <label>Name</label>
        <input type="text">

        <label>Email</label>
        <input type="email">

        <label>Age</label>
        <input type="number">

        <label>Course</label>
        <select>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
        </select>

        <button>Register</button>

    </form>

</body>

</html>
