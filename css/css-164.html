<!DOCTYPE html>
<html>

<head>
    <title>Trigger and Action Workflow</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        .trigger {
            border-left: 6px solid #f59e0b;
        }

        .action {
            border-left: 6px solid #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Trigger & Action Workflow</h1>

        <div class="card trigger">
            <h2>Trigger</h2>
            <p>When a new customer registers</p>
        </div>

        <div class="card action">
            <h2>Action</h2>
            <p>Send a welcome email</p>
        </div>

        <div class="card action">
            <h2>Action</h2>
            <p>Create customer record</p>
        </div>
    </div>

</body>

</html>
