<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;

            /* Content */
            height: 150px;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 40px;

            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">

        <h2>Box Model</h2>

        <p>
            Content + Padding + Border + Margin
        </p>

    </div>

</body>

</html>
