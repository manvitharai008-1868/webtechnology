<!DOCTYPE html>
<html>

<head>
    <title>Area Chart</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .chart {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        svg {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Area Chart Analytics</h1>

    <div class="chart">

        <svg viewBox="0 0 700 260">

            <polygon points="
        20,220
        20,180
        130,150
        230,175
        330,90
        430,125
        530,60
        650,95
        650,220" fill="#bfdbfe" />

            <polyline points="
        20,180
        130,150
        230,175
        330,90
        430,125
        530,60
        650,95" fill="none" stroke="#2563eb" stroke-width="5" />

        </svg>

    </div>

</body>

</html>
