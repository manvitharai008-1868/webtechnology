<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Borders</title>

    <style>
        .box {
            width: 250px;
            padding: 20px;
            margin: 15px;
        }

        .solid {
            border: 4px solid blue;
        }

        .dashed {
            border: 4px dashed green;
        }

        .dotted {
            border: 4px dotted red;
        }

        .double {
            border: 6px double purple;
        }

        .rounded {
            border: 4px solid orange;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Border Styles</h1>

    <div class="box solid">Solid Border</div>

    <div class="box dashed">Dashed Border</div>

    <div class="box dotted">Dotted Border</div>

    <div class="box double">Double Border</div>

    <div class="box rounded">Rounded Border</div>

    <br>

</body>

</html>
