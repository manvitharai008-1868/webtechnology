<!DOCTYPE html>
<html>

<head>
    <title>Security Settings</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px
        }

        .box {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        .setting {
            padding: 18px;
            border-bottom: 1px solid #ddd
        }

        button {
            padding: 9px 16px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Security Settings</h1>
        <div class="setting">
            <h3>Password</h3>
            <p>Last changed 30 days ago</p><button>Change Password</button>
        </div>
        <div class="setting">
            <h3>Two-Factor Authentication</h3>
            <p>Recommended for account security</p><button>Enable</button>
        </div>
        <div class="setting">
            <h3>Login Alerts</h3>
            <p>Receive alerts for new logins</p><input type="checkbox" checked>
        </div>
    </div>
</body>

</html>
