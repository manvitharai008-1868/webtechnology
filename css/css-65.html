<!DOCTYPE html>
<html>

<head>
    <title>Toast Notification</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #222;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h2>Toast Notification</h2>

    <button onclick="showToast()">Show Notification</button>

    <div class="toast" id="toast">
        ✓ Changes saved successfully!
    </div>

    <script>
        function showToast() {
            alert("Toast notification displayed!");
        }
    </script>

</body>

</html>
