<!DOCTYPE html>
<html>

<head>
    <title>Sales Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #0002;
        }

        h2 {
            color: #2563eb;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Sales Analytics Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h3>Orders</h3>
            <h2>3,840</h2>
        </div>

        <div class="card">
            <h3>Units Sold</h3>
            <h2>8,920</h2>
        </div>

        <div class="card">
            <h3>Average Order</h3>
            <h2>₹2,460</h2>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <h2>₹94.6L</h2>
        </div>
    </div>

    <table>
        <tr>
            <th>Product</th>
            <th>Units</th>
            <th>Sales</th>
        </tr>

        <tr>
            <td>Pro Plan</td>
            <td>1240</td>
            <td>₹30.4L</td>
        </tr>

        <tr>
            <td>Starter Plan</td>
            <td>980</td>
            <td>₹14.7L</td>
        </tr>

        <tr>
            <td>Enterprise</td>
            <td>430</td>
            <td>₹49.5L</td>
        </tr>
    </table>

</body>

</html>
