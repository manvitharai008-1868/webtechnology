<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 126 - AI Summary Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .summary-card {
            max-width: 700px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ddd;
        }

        .summary-card h2 {
            margin-top: 0;
        }

        .points {
            padding-left: 20px;
            line-height: 2;
        }

        .label {
            background: #eee;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="summary-card">

        <span class="label">AI Summary</span>

        <h2>Web Development</h2>

        <ul class="points">
            <li>HTML creates webpage structure.</li>
            <li>CSS styles webpages.</li>
            <li>JavaScript adds interactivity.</li>
            <li>Responsive design supports different devices.</li>
        </ul>

    </div>

</body>

</html>
