<!DOCTYPE html>
<html>

<head>
    <title>Dark Mode SaaS</title>
    <style>
        :root {
            --bg: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --primary: #60a5fa;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: var(--bg);
            color: var(--text)
        }

        header {
            padding: 25px;
            background: var(--card)
        }

        main {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px
        }

        button {
            background: var(--primary);
            border: 0;
            padding: 10px 20px;
            border-radius: 6px
        }

        @media(max-width:700px) {
            main {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>SaaS Dashboard</h1>
    </header>
    <main>
        <div class="card">
            <h2>Users</h2>
            <p>2,450</p>
        </div>
        <div class="card">
            <h2>Revenue</h2>
            <p>₹85K</p>
        </div>
        <div class="card">
            <h2>Projects</h2>
            <p>124</p>
        </div>
    </main>
</body>

</html>
