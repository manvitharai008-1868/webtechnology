<!DOCTYPE html>
<html>

<head>
    <title>User Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left
        }

        th {
            background: #2563eb;
            color: white
        }
    </style>
</head>

<body>
    <h1>User Management</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>Alex</td>
            <td>alex@mail.com</td>
            <td>Admin</td>
            <td>Active</td>
        </tr>
        <tr>
            <td>Priya</td>
            <td>priya@mail.com</td>
            <td>Editor</td>
            <td>Active</td>
        </tr>
        <tr>
            <td>John</td>
            <td>john@mail.com</td>
            <td>User</td>
            <td>Inactive</td>
        </tr>
    </table>
</body>

</html>
