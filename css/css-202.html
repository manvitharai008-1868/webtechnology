<!DOCTYPE html>
<html>

<head>
    <title>SaaS Billing Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px
        }

        .cards {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd
        }

        .value {
            font-size: 28px;
            font-weight: bold
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: repeat(2, 1fr)
            }
        }
    </style>
</head>

<body>
    <h1 style="text-align:center">Billing Dashboard</h1>
    <div class="cards">
        <div class="card">
            <h3>Revenue</h3>
            <div class="value">₹85K</div>
        </div>
        <div class="card">
            <h3>Invoices</h3>
            <div class="value">124</div>
        </div>
        <div class="card">
            <h3>Paid</h3>
            <div class="value">₹72K</div>
        </div>
        <div class="card">
            <h3>Pending</h3>
            <div class="value">₹13K</div>
        </div>
    </div>
</body>

</html>
