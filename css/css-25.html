<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Cursor Styles</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .cursor {
            padding: 20px;
            margin: 10px;
            border: 2px solid #333;
            background: lightblue;
            width: 250px;
        }

        .pointer {
            cursor: pointer;
        }

        .help {
            cursor: help;
        }

        .not-allowed {
            cursor: not-allowed;
        }

        .crosshair {
            cursor: crosshair;
        }

        .move {
            cursor: move;
        }

        .text {
            cursor: text;
        }
    </style>
</head>

<body>

    <h1>CSS Cursor Styles</h1>

    <div class="cursor pointer">Pointer Cursor</div>

    <div class="cursor help">Help Cursor</div>

    <div class="cursor not-allowed">Not Allowed Cursor</div>

    <div class="cursor crosshair">Crosshair Cursor</div>

    <div class="cursor move">Move Cursor</div>

    <div class="cursor text">Text Cursor</div>

    <br>

</body>

</html>
