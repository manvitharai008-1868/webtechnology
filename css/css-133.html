<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 133 - AI Document Summarizer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .summary {
            line-height: 1.7;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">
            <h1>AI Document Summarizer</h1>

            <textarea placeholder="Paste your document here..."></textarea>

            <button>Summarize Document</button>
        </div>

        <div class="box">

            <h2>Summary</h2>

            <div class="summary">
                <p>
                    This is an AI-generated summary of the document.
                    Important points are presented in a short and simple form.
                </p>
            </div>

        </div>

    </div>

</body>

</html>
