<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inline Internal External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css-01.css">

    <!-- Internal CSS -->
    <style>
        .internal {
            color: green;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <h1>Types of CSS</h1>

    <!-- Inline CSS -->
    <p style="color: red; font-size: 20px;">
        This paragraph uses Inline CSS.
    </p>

    <!-- Internal CSS -->
    <p class="internal">
        This paragraph uses Internal CSS.
    </p>

    <!-- External CSS -->
    <p class="external">
        This paragraph uses External CSS.
    </p>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
