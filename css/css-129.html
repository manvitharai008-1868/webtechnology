<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 129 - AI Copilot Interface</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .copilot {
            max-width: 850px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px #ddd;
        }

        .header {
            padding: 20px;
            background: #222;
            color: white;
        }

        .content {
            padding: 25px;
            min-height: 300px;
        }

        .message {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="copilot">

        <div class="header">
            <h2>AI Copilot</h2>
            <p>Your intelligent assistant</p>
        </div>

        <div class="content">

            <div class="message">
                <strong>Copilot:</strong>
                How can I help you today?
            </div>

            <div class="message">
                <strong>Suggestions:</strong>
                Explain code, write code, summarize text or generate ideas.
            </div>

        </div>

        <div class="input-area">
            <input type="text" placeholder="Ask Copilot...">
            <button>Send</button>
        </div>

    </div>

</body>

</html>
