<!DOCTYPE html>
<html>

<head>
    <title>Responsive CSS Grid</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 20px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center
        }

        @media(max-width:800px) {
            .grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(max-width:500px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <h1>Responsive CSS Grid</h1>
    <div class="grid">
        <div class="card">Box 1</div>
        <div class="card">Box 2</div>
        <div class="card">Box 3</div>
        <div class="card">Box 4</div>
    </div>
</body>

</html>
