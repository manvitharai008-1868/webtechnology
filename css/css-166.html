<!DOCTYPE html>
<html>

<head>
    <title>ML Forecast Chart</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .chart {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .bars {
            display: flex;
            align-items: end;
            height: 300px;
            gap: 20px;
            border-bottom: 2px solid #333;
        }

        .bar {
            flex: 1;
            background: #2563eb;
            text-align: center;
            color: white;
            padding-top: 5px;
        }
    </style>
</head>

<body>

    <div class="chart">
        <h1>ML Forecast Chart</h1>

        <div class="bars">
            <div class="bar" style="height: 40%;">40</div>
            <div class="bar" style="height: 55%;">55</div>
            <div class="bar" style="height: 65%;">65</div>
            <div class="bar" style="height: 75%;">75</div>
            <div class="bar" style="height: 90%;">90</div>
        </div>
    </div>

</body>

</html>
