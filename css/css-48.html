<!DOCTYPE html>
<html>

<head>
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f5f5f5;
        }

        .product {
            width: 280px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd;
        }

        .product-image {
            height: 150px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 40px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="product">

        <div class="product-image">💻</div>

        <h2>Laptop</h2>

        <p>Powerful laptop for students and developers.</p>

        <p class="price">₹50,000</p>

        <button>Buy Now</button>

    </div>

</body>

</html>
