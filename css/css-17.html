<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Shadows</title>

    <style>
        h1 {
            text-shadow: 3px 3px 5px gray;
        }

        .card {
            width: 300px;
            padding: 30px;

            background-color: white;

            border-radius: 15px;

            box-shadow:
                5px 5px 15px gray;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Shadow Effects</h1>

    <div class="card">

        <h2>Card Shadow</h2>

        <p>
            This card uses the CSS box-shadow property.
        </p>

    </div>

    <br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
