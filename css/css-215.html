<!DOCTYPE html>
<html>

<head>
    <title>Responsive SaaS Cards</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap
        }

        .card {
            flex: 1 1 250px;
            background: white;
            padding: 25px;
            border-radius: 12px
        }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <h1>Responsive SaaS Cards</h1>
    <div class="cards">
        <div class="card">
            <h2>Analytics</h2>
            <p>Track business performance.</p><button>View</button>
        </div>
        <div class="card">
            <h2>Reports</h2>
            <p>Create detailed reports.</p><button>View</button>
        </div>
        <div class="card">
            <h2>Users</h2>
            <p>Manage your customers.</p><button>View</button>
        </div>
    </div>
</body>

</html>
