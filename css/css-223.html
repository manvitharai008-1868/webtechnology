<!DOCTYPE html>
<html>

<head>
    <title>Mobile Bottom Navigation</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding-bottom: 70px;
            text-align: center
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 15px
        }

        .nav a {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold
        }
    </style>
</head>

<body>
    <h1>Dashboard</h1>
    <p>Mobile SaaS Application</p>
    <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Search</a>
        <a href="#">Reports</a>
        <a href="#">Profile</a>
    </nav>
</body>

</html>
