<!DOCTYPE html>
<html>

<head>
    <title>Profile Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .profile {
            width: 280px;
            background: white;
            text-align: center;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ddd;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 30px;
        }

        .profile button {
            padding: 10px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="avatar">MR</div>

        <h2>Manvitha Rai</h2>

        <p>Python Developer</p>

        <button>View Profile</button>

    </div>

</body>

</html>
