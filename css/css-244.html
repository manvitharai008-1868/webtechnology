<!DOCTYPE html>
<html>

<head>
    <title>SaaS Calendar</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .calendar {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px
        }

        .day {
            padding: 20px;
            text-align: center;
            border: 1px solid #ddd
        }

        .header {
            background: #2563eb;
            color: white
        }
    </style>
</head>

<body>
    <div class="calendar">
        <h1>September 2026</h1>
        <div class="days">
            <div class="day header">Mon</div>
            <div class="day header">Tue</div>
            <div class="day header">Wed</div>
            <div class="day header">Thu</div>
            <div class="day header">Fri</div>
            <div class="day header">Sat</div>
            <div class="day header">Sun</div>
            <div class="day">1</div>
            <div class="day">2</div>
            <div class="day">3</div>
            <div class="day">4</div>
            <div class="day">5</div>
            <div class="day">6</div>
            <div class="day">7</div>
            <div class="day">8</div>
            <div class="day">9</div>
            <div class="day">10</div>
            <div class="day">11</div>
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
        </div>
    </div>
</body>

</html>
