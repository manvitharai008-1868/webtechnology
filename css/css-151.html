<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 151 - AI Agent Activity Log</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
        }

        .log {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        .entry {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .time {
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI Agent Activity Log</h1>

        <div class="log">

            <div class="entry">
                <strong>Research Agent started a task.</strong>
                <div class="time">10:30 AM</div>
            </div>

            <div class="entry">
                <strong>Data Agent analyzed 500 records.</strong>
                <div class="time">10:35 AM</div>
            </div>

            <div class="entry">
                <strong>Report Agent generated a report.</strong>
                <div class="time">10:42 AM</div>
            </div>

            <div class="entry">
                <strong>Research Agent completed the task.</strong>
                <div class="time">10:50 AM</div>
            </div>

        </div>

    </div>

</body>

</html>
