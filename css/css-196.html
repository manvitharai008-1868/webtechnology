<!DOCTYPE html>
<html>

<head>
    <title>Active Sessions</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .box {
            max-width: 800px;
            margin: auto
        }

        .session {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 2px 8px #ddd
        }

        button {
            padding: 8px 15px;
            background: #dc2626;
            color: white;
            border: 0;
            border-radius: 5px
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Active Sessions</h1>
        <div class="session">
            <div>
                <h3>Windows PC</h3>
                <p>Chrome · Active now</p>
            </div><button>Sign Out</button>
        </div>
        <div class="session">
            <div>
                <h3>Android Phone</h3>
                <p>Chrome · 2 hours ago</p>
            </div><button>Sign Out</button>
        </div>
        <div class="session">
            <div>
                <h3>Laptop</h3>
                <p>Edge · Yesterday</p>
            </div><button>Sign Out</button>
        </div>
    </div>
</body>

</html>
