<!DOCTYPE html>
<html>

<head>
    <title>Pricing Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .pricing {
            width: 300px;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ddd;
        }

        .price {
            font-size: 35px;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 12px;
        }

        button {
            padding: 12px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="pricing">

        <h2>Basic Plan</h2>

        <div class="price">₹499</div>

        <p>per month</p>

        <ul>
            <li>✓ 5 Projects</li>
            <li>✓ 10 GB Storage</li>
            <li>✓ Email Support</li>
        </ul>

        <button>Choose Plan</button>

    </div>

</body>

</html>
