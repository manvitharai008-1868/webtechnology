<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 50px;
        }

        .form {
            width: 320px;
            background: white;
            padding: 30px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="form">

        <h2>Login</h2>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>

</body>

</html>
