<!DOCTYPE html>
<html>

<head>
    <title>Accordion</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .accordion {
            width: 500px;
        }

        details {
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 6px;
            padding: 15px;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Frequently Asked Questions</h2>

    <div class="accordion">

        <details>
            <summary>What is HTML?</summary>
            <p>HTML is used to create the structure of webpages.</p>
        </details>

        <details>
            <summary>What is CSS?</summary>
            <p>CSS is used to style webpages.</p>
        </details>

        <details>
            <summary>What is JavaScript?</summary>
            <p>JavaScript adds functionality and interactivity.</p>
        </details>

    </div>

</body>

</html>
