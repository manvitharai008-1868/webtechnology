<!DOCTYPE html>
<html>

<head>
    <title>ML Feature Importance</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .chart {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .feature {
            margin: 20px 0;
        }

        .bar {
            height: 25px;
            background: #2563eb;
            border-radius: 5px;
            color: white;
            padding-left: 10px;
            line-height: 25px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="chart">

        <h1>Feature Importance</h1>

        <div class="feature">
            <p>Income - 85%</p>
            <div class="bar" style="width:85%">85%</div>
        </div>

        <div class="feature">
            <p>Age - 65%</p>
            <div class="bar" style="width:65%">65%</div>
        </div>

        <div class="feature">
            <p>Experience - 50%</p>
            <div class="bar" style="width:50%">50%</div>
        </div>

        <div class="feature">
            <p>Location - 30%</p>
            <div class="bar" style="width:30%">30%</div>
        </div>

    </div>

</body>

</html>
