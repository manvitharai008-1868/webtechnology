<!DOCTYPE html>
<html>

<head>
    <title>Marketing Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #fff7ed;
            padding: 30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #0002;
        }

        h2 {
            color: #ea580c;
        }

        @media(max-width:700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Marketing Analytics</h1>

    <div class="dashboard">

        <div class="card">
            <h3>Campaigns</h3>
            <h2>24</h2>
            <p>8 active</p>
        </div>

        <div class="card">
            <h3>Reach</h3>
            <h2>1.82M</h2>
            <p>+24%</p>
        </div>

        <div class="card">
            <h3>CTR</h3>
            <h2>6.4%</h2>
            <p>+1.2%</p>
        </div>

        <div class="card">
            <h3>Leads</h3>
            <h2>12,840</h2>
            <p>+17%</p>
        </div>

    </div>

</body>

</html>
