<!DOCTYPE html>
<html>

<head>
    <title>Line Chart</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .chart {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        svg {
            width: 100%;
        }

        polyline {
            fill: none;
            stroke: #2563eb;
            stroke-width: 5;
        }
    </style>
</head>

<body>

    <h1>Line Chart Analytics</h1>

    <div class="chart">

        <svg viewBox="0 0 700 260">

            <polyline points="
        20,210
        100,180
        180,195
        260,120
        340,145
        420,80
        500,105
        600,55
        " />

        </svg>

    </div>

</body>

</html>
