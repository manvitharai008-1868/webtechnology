<!DOCTYPE html>
<html>

<head>
    <title>SaaS Onboarding</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 40px;
            text-align: center
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px
        }

        .steps {
            display: flex;
            justify-content: space-between;
            margin: 30px 0
        }

        .step {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center
        }

        button {
            padding: 12px 30px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to CloudApp</h1>
        <p>Let's set up your account.</p>
        <div class="steps">
            <div class="step">1</div>
            <div class="step">2</div>
            <div class="step">3</div>
            <div class="step">4</div>
        </div>
        <h2>Set Up Your Profile</h2>
        <p>Add your information to continue.</p>
        <button>Continue</button>
    </div>
</body>

</html>
