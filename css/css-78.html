<!DOCTYPE html>
<html>

<head>
    <title>Progress Bar</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .progress {
            width: 500px;
            height: 25px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar {
            width: 70%;
            height: 100%;
            background: #2563eb;
            text-align: center;
            color: white;
        }
    </style>
</head>

<body>

    <h2>Project Progress</h2>

    <div class="progress">
        <div class="bar">70%</div>
    </div>

</body>

</html>
