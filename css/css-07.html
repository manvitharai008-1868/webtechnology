<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Gradients</title>

    <style>
        .linear {
            height: 200px;
            padding: 30px;
            color: white;
            font-size: 25px;
            background: linear-gradient(90deg,
                    #2563eb,
                    #7c3aed);
        }

        .radial {
            height: 200px;
            padding: 30px;
            color: white;
            font-size: 25px;
            background: radial-gradient(circle,
                    #f97316,
                    #dc2626);
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="linear">
        Linear Gradient
    </div>

    <br>

    <div class="radial">
        Radial Gradient
    </div>

    <br>

</body>

</html>
