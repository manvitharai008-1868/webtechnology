<!DOCTYPE html>
<html>

<head>
    <title>SaaS Landing Page Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
        }

        .signup {
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">MySaaS</div>

        <nav>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <a class="signup" href="#">Sign Up</a>

    </header>

</body>

</html>
