<!DOCTYPE html>
<html>

<head>
    <title>Security Settings</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .settings {
            max-width: 700px;
            margin: auto
        }

        .item {
            background: white;
            padding: 22px;
            margin: 15px 0;
            border-radius: 10px
        }

        button {
            padding: 9px 16px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="settings">
        <h1>Security Settings</h1>
        <div class="item">
            <h2>Password</h2>
            <p>Change your account password.</p><button>Change</button>
        </div>
        <div class="item">
            <h2>Two-Factor Authentication</h2>
            <p>Protect your account.</p><button>Enable</button>
        </div>
        <div class="item">
            <h2>Login Alerts</h2>
            <p>Receive security notifications.</p><button>Enable</button>
        </div>
    </div>
</body>

</html>
