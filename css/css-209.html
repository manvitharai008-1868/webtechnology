<!DOCTYPE html>
<html>

<head>
    <title>AI Spending Limits</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box
        }

        button {
            margin-top: 20px;
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>AI Spending Limits</h1>
        <label>Monthly Spending Limit</label>
        <input type="number" value="5000">
        <p>Current spending: ₹2,850</p>
        <p>Remaining: ₹2,150</p>
        <button>Update Limit</button>
    </div>
</body>

</html>
