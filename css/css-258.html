<!DOCTYPE html>
<html>

<head>
    <title>Account Settings</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .form {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="form">
        <h1>Account Settings</h1>
        <label>Full Name</label>
        <input value="Manvitha Rai">
        <label>Email</label>
        <input value="manvitha@example.com">
        <label>Company</label>
        <input placeholder="Company Name">
        <button>Save Changes</button>
    </div>
</body>

</html>
