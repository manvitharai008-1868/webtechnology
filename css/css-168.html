<!DOCTYPE html>
<html>

<head>
    <title>ML Confidence Score</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .confidence {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px #ddd;
        }

        .score {
            font-size: 50px;
            font-weight: bold;
        }

        .progress {
            height: 20px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress div {
            width: 91%;
            height: 100%;
            background: #16a34a;
        }
    </style>
</head>

<body>

    <div class="confidence">
        <h1>ML Confidence Score</h1>

        <div class="score">91%</div>

        <div class="progress">
            <div></div>
        </div>

        <p>Model Confidence</p>
    </div>

</body>

</html>
