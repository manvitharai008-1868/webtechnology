<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Border Radius</title>

    <style>
        .card {
            width: 250px;
            padding: 30px;
            margin: 15px;
            background-color: lightblue;
            border-radius: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background-color: lightgreen;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill {
            display: inline-block;
            padding: 12px 30px;
            background-color: orange;
            border-radius: 50px;
        }

        .custom {
            width: 200px;
            height: 100px;
            background-color: pink;
            border-radius: 10px 40px 10px 40px;
        }
    </style>
</head>

<body>

    <h1>CSS Border Radius</h1>

    <div class="card">
        Rounded Card
    </div>

    <br>

    <div class="circle">
        Circle
    </div>

    <br>

    <div class="pill">
        Pill Shape
    </div>

    <br><br>

    <div class="custom">
        Custom Shape
    </div>

    <br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
