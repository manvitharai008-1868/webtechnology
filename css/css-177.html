<!DOCTYPE html>
<html>

<head>
    <title>ML Model Versions</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .version {
            background: white;
            padding: 20px;
            margin: 12px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px #ddd;
        }

        .active {
            border-left: 5px solid #16a34a;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        @media(max-width:600px) {
            .version {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ML Model Version Management</h1>

        <div class="version active">
            <div>
                <h3>Model v3.0</h3>
                <p>Current Production Version</p>
            </div>
            <button>Active</button>
        </div>

        <div class="version">
            <div>
                <h3>Model v2.5</h3>
                <p>Previous Version</p>
            </div>
            <button>Restore</button>
        </div>

        <div class="version">
            <div>
                <h3>Model v2.0</h3>
                <p>Archived Version</p>
            </div>
            <button>View</button>
        </div>

    </div>

</body>

</html>
