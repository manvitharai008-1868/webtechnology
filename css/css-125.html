<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 125 - AI Generated Content</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .card {
            max-width: 750px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .tag {
            display: inline-block;
            background: #e8e8e8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .content {
            line-height: 1.7;
            color: #555;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">

        <span class="tag">AI Generated</span>

        <h1>Introduction to Machine Learning</h1>

        <div class="content">
            <p>
                Machine Learning is a field of Artificial Intelligence
                that allows computers to learn patterns from data and
                improve their performance over time.
            </p>
        </div>

        <button>View Content</button>

    </div>

</body>

</html>
