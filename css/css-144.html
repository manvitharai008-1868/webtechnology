<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 144 - AI Sources</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 750px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .source {
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .source a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>AI Sources & Citations</h1>

            <p>Sources used to support the generated response:</p>

            <div class="source">
                <a href="#">Source 1 - Artificial Intelligence</a>
                <p>General information about AI technologies.</p>
            </div>

            <div class="source">
                <a href="#">Source 2 - Machine Learning</a>
                <p>Information about machine learning concepts.</p>
            </div>

            <div class="source">
                <a href="#">Source 3 - Data Science</a>
                <p>Information about data analysis and science.</p>
            </div>

        </div>

    </div>

</body>

</html>
