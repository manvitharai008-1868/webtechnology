<!DOCTYPE html>
<html>

<head>
    <title>Pagination</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .pagination {
            display: flex;
            gap: 8px;
        }

        .pagination a {
            padding: 10px 15px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #333;
            border-radius: 5px;
        }

        .pagination a.active {
            background: #2563eb;
            color: white;
        }

        .pagination a:hover {
            background: #eee;
        }
    </style>
</head>

<body>

    <h2>Pagination Component</h2>

    <div class="pagination">
        <a href="#">‹</a>
        <a class="active" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <a href="#">›</a>
    </div>

</body>

</html>
