<!DOCTYPE html>
<html>

<head>
    <title>Invoice Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd
        }

        th {
            background: #2563eb;
            color: white
        }

        button {
            padding: 7px 12px;
            border: 0;
            background: #2563eb;
            color: white;
            border-radius: 5px
        }
    </style>
</head>

<body>
    <h1 style="text-align:center">Invoice Management</h1>
    <table>
        <tr>
            <th>Invoice</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>#INV001</td>
            <td>01 Sep</td>
            <td>₹999</td>
            <td>Paid</td>
            <td><button>View</button></td>
        </tr>
        <tr>
            <td>#INV002</td>
            <td>15 Sep</td>
            <td>₹1499</td>
            <td>Pending</td>
            <td><button>Pay</button></td>
        </tr>
    </table>
</body>

</html>
