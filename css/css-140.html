<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 139 - AI Analytics Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        .value {
            font-size: 30px;
            font-weight: bold;
        }

        .insight {
            margin-top: 25px;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI-Powered Analytics Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Revenue</h3>
                <div class="value">₹85K</div>
            </div>

            <div class="card">
                <h3>Users</h3>
                <div class="value">12.5K</div>
            </div>

            <div class="card">
                <h3>Conversion</h3>
                <div class="value">8.4%</div>
            </div>

            <div class="card">
                <h3>Growth</h3>
                <div class="value">18%</div>
            </div>

        </div>

        <div class="insight">

            <h2>AI Insight</h2>

            <p>
                User activity and revenue show positive growth.
                The dashboard provides a quick overview of important metrics.
            </p>

        </div>

    </div>

</body>

</html>
