<!DOCTYPE html>
<html>

<head>
    <title>Breadcrumb Navigation</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .breadcrumb {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 8px;
        }

        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
        }

        .breadcrumb span {
            margin: 0 10px;
            color: #777;
        }
    </style>
</head>

<body>

    <h2>Breadcrumb Navigation</h2>

    <div class="breadcrumb">
        <a href="#">Home</a>
        <span>›</span>
        <a href="#">Products</a>
        <span>›</span>
        <a href="#">Software</a>
        <span>›</span>
        <b>Details</b>
    </div>

</body>

</html>
