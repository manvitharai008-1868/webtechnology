<!DOCTYPE html>
<html>

<head>
    <title>Confirmation Dialog</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .dialog {
            width: 350px;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 5px 15px #ddd;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }

        .confirm {
            background: #dc2626;
            color: white;
        }
    </style>
</head>

<body>

    <div class="dialog">

        <h2>Delete Item?</h2>

        <p>Are you sure you want to delete this item?</p>

        <button>Cancel</button>

        <button class="confirm">Confirm</button>

    </div>

</body>

</html>
