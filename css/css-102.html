<!DOCTYPE html>
<html>

<head>
    <title>Conversion Funnel Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .funnel {
            max-width: 700px;
            margin: auto;
        }

        .step {
            margin: 12px auto;
            padding: 20px;
            text-align: center;
            background: #bfdbfe;
            border-radius: 10px;
            font-weight: bold;
        }

        .one {
            width: 100%;
        }

        .two {
            width: 75%;
        }

        .three {
            width: 50%;
        }

        .four {
            width: 30%;
        }
    </style>
</head>

<body>

    <h1>Conversion Funnel Dashboard</h1>

    <div class="funnel">

        <div class="step one">
            Visitors — 100%
        </div>

        <div class="step two">
            Signups — 62%
        </div>

        <div class="step three">
            Activated — 38%
        </div>

        <div class="step four">
            Paid — 18%
        </div>

    </div>

</body>

</html>
