<!DOCTYPE html>
<html>

<head>
    <title>Integrations Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 30px
        }

        .container {
            max-width: 900px;
            margin: auto
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Integrations Management</h1>
        <div class="grid">
            <div class="card">
                <h2>Google Drive</h2>
                <p>Cloud storage integration</p><button>Connect</button>
            </div>
            <div class="card">
                <h2>Slack</h2>
                <p>Team communication</p><button>Connect</button>
            </div>
            <div class="card">
                <h2>GitHub</h2>
                <p>Code management</p><button>Connect</button>
            </div>
        </div>
    </div>
</body>

</html>
