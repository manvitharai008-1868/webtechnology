<!DOCTYPE html>
<html>

<head>
    <title>Customer Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #ecfeff;
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h2 {
            color: #0891b2;
        }

        @media(max-width:700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Customer Analytics</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Customers</h3>
            <h2>18,240</h2>
        </div>

        <div class="card">
            <h3>New Customers</h3>
            <h2>1,840</h2>
        </div>

        <div class="card">
            <h3>Retention</h3>
            <h2>86%</h2>
        </div>

        <div class="card">
            <h3>Satisfaction</h3>
            <h2>4.7/5</h2>
        </div>

    </div>

</body>

</html>
