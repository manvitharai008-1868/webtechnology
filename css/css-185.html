<!DOCTYPE html>
<html>

<head>
    <title>Team Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .team {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .member {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px #ddd;
        }

        .avatar {
            width: 70px;
            height: 70px;
            margin: auto;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        @media(max-width:700px) {
            .team {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Team Management</h1>

        <div class="team">

            <div class="member">
                <div class="avatar">A</div>
                <h2>Alex</h2>
                <p>Developer</p>
            </div>

            <div class="member">
                <div class="avatar">S</div>
                <h2>Sarah</h2>
                <p>Designer</p>
            </div>

            <div class="member">
                <div class="avatar">J</div>
                <h2>John</h2>
                <p>Manager</p>
            </div>

        </div>

    </div>

</body>

</html>
