<!DOCTYPE html>
<html>

<head>
    <title>Success State</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .success {
            width: 400px;
            text-align: center;
            padding: 40px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
        }

        .icon {
            font-size: 50px;
        }

        button {
            padding: 10px 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="success">

        <div class="icon">✅</div>

        <h2>Success!</h2>

        <p>Your operation was completed successfully.</p>

        <button>Continue</button>

    </div>

</body>

</html>
