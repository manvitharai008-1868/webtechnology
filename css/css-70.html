<!DOCTYPE html>
<html>

<head>
    <title>Drawer Panel</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: #222;
            color: white;
            padding: 30px;
        }

        .drawer a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 0;
        }
    </style>
</head>

<body>

    <div class="drawer">

        <h2>Menu</h2>

        <a href="#">Home</a>
        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>

    </div>

</body>

</html>
