<!DOCTYPE html>
<html>

<head>
    <title>CSS Only Modal</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 40px;
            text-align: center
        }

        .modal {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #aaa;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="modal">
        <h2>Welcome!</h2>
        <p>This is a CSS-only modal interface.</p>
        <button>Close</button>
    </div>
</body>

</html>
