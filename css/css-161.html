<!DOCTYPE html>
<html>

<head>
    <title>AI Agent Monitoring</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px #ddd;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>AI Agent Monitoring</h1>

    <div class="dashboard">

        <div class="card">
            <h3>Active Agents</h3>
            <div class="number">12</div>
        </div>

        <div class="card">
            <h3>Tasks Running</h3>
            <div class="number">28</div>
        </div>

        <div class="card">
            <h3>Success Rate</h3>
            <div class="number">96%</div>
        </div>

    </div>

</body>

</html>
