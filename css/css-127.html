<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 127 - AI Recommendation Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        .card h2 {
            margin-top: 0;
        }

        .reason {
            color: #666;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI Recommendations</h1>

        <div class="card">
            <h2>Learn Python</h2>
            <p class="reason">
                Recommended because Python is useful for software development,
                data science and AI.
            </p>
            <button>Explore</button>
        </div>

        <div class="card">
            <h2>Learn Git & GitHub</h2>
            <p class="reason">
                Recommended for managing and sharing programming projects.
            </p>
            <button>Explore</button>
        </div>

    </div>

</body>

</html>
