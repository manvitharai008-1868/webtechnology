<!DOCTYPE html>
<html>

<head>
    <title>Empty State</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .empty {
            width: 400px;
            text-align: center;
            padding: 50px;
            border: 1px dashed #ccc;
            border-radius: 12px;
        }

        .icon {
            font-size: 50px;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="empty">

        <div class="icon">📂</div>

        <h2>No Projects Found</h2>

        <p>You don't have any projects yet.</p>

        <button>Create Project</button>

    </div>

</body>

</html>
