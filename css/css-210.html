<!DOCTYPE html>
<html>

<head>
    <title>Billing Alerts</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px
        }

        .alert {
            max-width: 700px;
            margin: 15px auto;
            padding: 20px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 3px 10px #ddd
        }

        .warning {
            border-left: 6px solid #f59e0b
        }

        .info {
            border-left: 6px solid #2563eb
        }
    </style>
</head>

<body>
    <h1 style="text-align:center">Billing Alerts</h1>
    <div class="alert warning">
        <h3>⚠ Spending Limit</h3>
        <p>80% of your monthly AI budget has been used.</p>
    </div>
    <div class="alert info">
        <h3>ℹ Invoice Available</h3>
        <p>Your latest invoice is ready.</p>
    </div>
</body>

</html>
