<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            height: 1200px;
            padding: 20px;
        }

        .box {
            width: 180px;
            height: 80px;
            padding: 15px;
            margin: 15px;
            border: 2px solid black;
        }

        .static {
            position: static;
            background: lightgray;
        }

        .relative {
            position: relative;
            left: 30px;
            background: lightblue;
        }

        .parent {
            position: relative;
            width: 350px;
            height: 180px;
            background: lightgreen;
            margin: 20px;
        }

        .absolute {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: orange;
            padding: 15px;
        }

        .fixed {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: red;
            color: white;
            padding: 15px;
        }

        .sticky {
            position: sticky;
            top: 0;
            background: purple;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>CSS Positioning</h1>

    <div class="box static">Static Position</div>

    <div class="box relative">Relative Position</div>

    <div class="parent">
        Parent Element

        <div class="absolute">
            Absolute Position
        </div>
    </div>

    <div class="sticky">
        Sticky Position - Scroll the page
    </div>

    <p>
        Scroll down to observe the fixed and sticky elements.
    </p>

    <p style="margin-top:700px;">
        More page content...
    </p>

    <div class="fixed">
        Fixed Position
    </div>

    <br><br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
