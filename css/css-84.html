<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 50px;
        }

        .form {
            width: 350px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="form">

        <h2>Reset Password</h2>

        <input type="password" placeholder="New Password">

        <input type="password" placeholder="Confirm Password">

        <button>Reset Password</button>

    </div>

</body>

</html>
