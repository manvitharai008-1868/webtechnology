<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Fonts</title>

    <style>
        .family {
            font-family: Arial, sans-serif;
        }

        .size {
            font-size: 30px;
        }

        .weight {
            font-weight: bold;
        }

        .style {
            font-style: italic;
        }

        .variant {
            font-variant: small-caps;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="family">
        This text uses Arial font family.
    </p>

    <p class="size">
        This text demonstrates font size.
    </p>

    <p class="weight">
        This text is bold.
    </p>

    <p class="style">
        This text is italic.
    </p>

    <p class="variant">
        This text demonstrates font variant.
    </p>

    <br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
