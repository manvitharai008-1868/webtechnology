<!DOCTYPE html>
<html>

<head>
    <title>File Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .files {
            max-width: 800px;
            margin: auto
        }

        .file {
            background: white;
            padding: 18px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between
        }
    </style>
</head>

<body>
    <div class="files">
        <h1>My Files</h1>
        <div class="file">📁 Projects <span>Folder</span></div>
        <div class="file">📄 Report.pdf <span>2.4 MB</span></div>
        <div class="file">📊 Analytics.xlsx <span>1.2 MB</span></div>
        <div class="file">🖼️ Profile.png <span>850 KB</span></div>
    </div>
</body>

</html>
