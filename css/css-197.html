<!DOCTYPE html>
<html>

<head>
    <title>Audit Log</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px
        }

        .box {
            max-width: 900px;
            margin: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            text-align: left
        }

        th {
            background: #2563eb;
            color: white
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Audit Log</h1>
        <table>
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Date</th>
            </tr>
            <tr>
                <td>Alex</td>
                <td>Updated profile</td>
                <td>Today</td>
            </tr>
            <tr>
                <td>Sarah</td>
                <td>Created API key</td>
                <td>Yesterday</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Changed password</td>
                <td>Yesterday</td>
            </tr>
        </table>
    </div>
</body>

</html>
