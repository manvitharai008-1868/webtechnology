<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 145 - AI Explanation Interface</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .step {
            padding: 20px;
            margin: 15px 0;
            background: #f3f3f3;
            border-left: 4px solid #555;
            border-radius: 8px;
        }

        .step h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>AI Explanation & Reasoning</h1>

            <div class="step">
                <h3>Step 1</h3>
                <p>Understand the input provided by the user.</p>
            </div>

            <div class="step">
                <h3>Step 2</h3>
                <p>Analyze the relevant information.</p>
            </div>

            <div class="step">
                <h3>Step 3</h3>
                <p>Generate an appropriate response.</p>
            </div>

            <div class="step">
                <h3>Result</h3>
                <p>The final response is presented to the user.</p>
            </div>

        </div>

    </div>

</body>

</html>
