<!DOCTYPE html>
<html>

<head>
    <title>Error State</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .error {
            width: 400px;
            text-align: center;
            padding: 40px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            border-radius: 12px;
        }

        .icon {
            font-size: 50px;
        }

        button {
            padding: 10px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="error">

        <div class="icon">⚠️</div>

        <h2>Something Went Wrong</h2>

        <p>We could not load the requested information.</p>

        <button>Try Again</button>

    </div>

</body>

</html>
