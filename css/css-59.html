<!DOCTYPE html>
<html>

<head>
    <title>Button Components</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        button {
            padding: 12px 22px;
            border-radius: 6px;
            margin: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary {
            background: #2563eb;
            color: white;
            border: none;
        }

        .secondary {
            background: #666;
            color: white;
            border: none;
        }

        .outline {
            background: white;
            color: #2563eb;
            border: 2px solid #2563eb;
        }

        .destructive {
            background: #dc2626;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h2>Button Components</h2>

    <button class="primary">Primary</button>

    <button class="secondary">Secondary</button>

    <button class="outline">Outline</button>

    <button class="destructive">Delete</button>

</body>

</html>
