<!DOCTYPE html>
<html>

<head>
    <title>Notification Card</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .notification {
            width: 350px;
            padding: 20px;
            border-left: 5px solid #2563eb;
            background: #f1f5ff;
            border-radius: 8px;
        }

        .notification h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <div class="notification">

        <h3>🔔 New Notification</h3>

        <p>You have received a new project update.</p>

        <small>2 minutes ago</small>

    </div>

</body>

</html>
