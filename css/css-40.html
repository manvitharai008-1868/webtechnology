<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Navigation Menu</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        nav {
            background: #111827;
            padding: 15px 30px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: none;

            position: absolute;
            top: 35px;
            left: 0;

            background: white;

            min-width: 180px;

            box-shadow: 0 5px 15px #aaa;
        }

        .dropdown-menu a {
            display: block;
            color: #333;
            padding: 12px;
        }

        .dropdown-menu a:hover {
            background: #e5e7eb;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .content {
            padding: 40px;
        }
    </style>
</head>

<body>

    <nav>

        <ul>

            <li>
                <a href="#">Home</a>
            </li>

            <li class="dropdown">

                <a href="#">Products ▼</a>

                <div class="dropdown-menu">

                    <a href="#">Product 1</a>
                    <a href="#">Product 2</a>
                    <a href="#">Product 3</a>
                    <a href="#">Product 4</a>

                </div>

            </li>

            <li>
                <a href="#">Pricing</a>
            </li>

            <li>
                <a href="#">Contact</a>
            </li>

        </ul>

    </nav>

    <main class="content">

        <h1>Dropdown Navigation Menu</h1>

        <p>
            Move the mouse over Products to see the dropdown menu.
        </p>

    </main>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
