<!DOCTYPE html>
<html>

<head>
    <title>Revenue Chart Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .chart {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
        }

        svg {
            width: 100%;
        }

        polyline {
            fill: none;
            stroke: #2563eb;
            stroke-width: 6;
        }
    </style>
</head>

<body>

    <h1>Revenue Chart Dashboard</h1>

    <div class="chart">

        <h2>Monthly Revenue</h2>

        <svg viewBox="0 0 700 250">

            <polyline points="
        20,210
        120,170
        220,185
        320,120
        420,140
        520,70
        650,90
        " />

        </svg>

    </div>

</body>

</html>
