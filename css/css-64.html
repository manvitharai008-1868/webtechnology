<!DOCTYPE html>
<html>

<head>
    <title>Alert Components</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .alert {
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>

<body>

    <h2>Alert Components</h2>

    <div class="alert success">
        ✓ Success! Your data was saved.
    </div>

    <div class="alert warning">
        ⚠ Warning! Please check your information.
    </div>

    <div class="alert error">
        ✕ Error! Something went wrong.
    </div>

    <div class="alert info">
        ℹ Information! New updates are available.
    </div>

</body>

</html>
