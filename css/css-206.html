<!DOCTYPE html>
<html>

<head>
    <title>Usage Based Billing</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .box {
            max-width: 700px;
            margin: auto
        }

        .item {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px
        }

        .amount {
            float: right;
            font-weight: bold
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Usage-Based Billing</h1>
        <div class="item">API Requests <span class="amount">12,500 × ₹0.05</span></div>
        <div class="item">Storage <span class="amount">50 GB × ₹10</span></div>
        <div class="item">AI Processing <span class="amount">1,200 tokens × ₹0.02</span></div>
        <h2>Total: ₹2,225</h2>
    </div>
</body>

</html>
