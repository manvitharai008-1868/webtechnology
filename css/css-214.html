<!DOCTYPE html>
<html>

<head>
    <title>Responsive Data Table</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f7fa
        }

        .table {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            min-width: 600px
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left
        }

        th {
            background: #2563eb;
            color: white
        }
    </style>
</head>

<body>
    <h1>Responsive Data Table</h1>
    <div class="table">
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>Alex</td>
                <td>alex@mail.com</td>
                <td>Admin</td>
                <td>Active</td>
            </tr>
            <tr>
                <td>Sarah</td>
                <td>sarah@mail.com</td>
                <td>Editor</td>
                <td>Active</td>
            </tr>
            <tr>
                <td>John</td>
                <td>john@mail.com</td>
                <td>User</td>
                <td>Inactive</td>
            </tr>
        </table>
    </div>
</body>

</html>
