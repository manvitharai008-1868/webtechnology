<!DOCTYPE html>
<html>

<head>
    <title>Customizable Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
        }

        h2 {
            color: #4f46e5;
        }

        @media(max-width:700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Customizable Analytics Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Traffic</h2>
            <p>84,200 visits</p>
        </div>

        <div class="card">
            <h2>Revenue</h2>
            <p>₹18.4L</p>
        </div>

        <div class="card">
            <h2>Users</h2>
            <p>42,840 users</p>
        </div>

        <div class="card">
            <h2>Conversion</h2>
            <p>8.2%</p>
        </div>

    </div>

</body>

</html>
