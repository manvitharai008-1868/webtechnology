<!DOCTYPE html>
<html>

<head>
    <title>Sticky SaaS Header</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f1f5f9
        }

        header {
            position: sticky;
            top: 0;
            background: #2563eb;
            color: white;
            padding: 20px;
            z-index: 10
        }

        main {
            padding: 30px;
            height: 1200px
        }

        .card {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 10px
        }
    </style>
</head>

<body>
    <header>
        <h2>SaaS Platform</h2>
    </header>
    <main>
        <div class="card">
            <h1>Dashboard</h1>
            <p>Scroll down to see the sticky header.</p>
        </div>
        <div class="card">
            <h1>Analytics</h1>
            <p>Analytics content.</p>
        </div>
        <div class="card">
            <h1>Reports</h1>
            <p>Reports content.</p>
        </div>
    </main>
</body>

</html>
