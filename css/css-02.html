<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Selectors</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* Element Selector */
        h1 {
            color: darkblue;
        }

        /* Class Selector */
        .student {
            color: green;
        }

        /* ID Selector */
        #special {
            color: red;
        }

        /* Attribute Selector */
        input[type="text"] {
            border: 2px solid blue;
            padding: 8px;
        }

        /* Grouping Selector */
        h2,
        h3 {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Element Selector</h2>

    <p class="student">
        This uses a Class Selector.
    </p>

    <p id="special">
        This uses an ID Selector.
    </p>

    <h3>Grouping Selector</h3>

    <input type="text" placeholder="Attribute selector">

    <br><br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
