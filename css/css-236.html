<!DOCTYPE html>
<html>

<head>
    <title>Gradient SaaS Interface</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f8fafc
        }

        .hero {
            padding: 80px 30px;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #2563eb, #9333ea)
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            padding: 40px;
            flex-wrap: wrap
        }

        .card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd
        }
    </style>
</head>

<body>
    <section class="hero">
        <h1>Modern SaaS Platform</h1>
        <p>Powerful tools for your business.</p>
    </section>
    <div class="cards">
        <div class="card">
            <h2>Analytics</h2>
            <p>Track data.</p>
        </div>
        <div class="card">
            <h2>Automation</h2>
            <p>Save time.</p>
        </div>
        <div class="card">
            <h2>Reports</h2>
            <p>Analyze results.</p>
        </div>
    </div>
</body>

</html>
