<!DOCTYPE html>
<html>

<head>
    <title>ML Model Performance</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px;
        }

        .dashboard {
            max-width: 900px;
            margin: auto;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>ML Model Performance</h1>

        <div class="metrics">

            <div class="card">
                <h3>Accuracy</h3>
                <div class="number">94%</div>
            </div>

            <div class="card">
                <h3>Precision</h3>
                <div class="number">91%</div>
            </div>

            <div class="card">
                <h3>Recall</h3>
                <div class="number">89%</div>
            </div>

            <div class="card">
                <h3>F1 Score</h3>
                <div class="number">90%</div>
            </div>

        </div>

    </div>

</body>

</html>
