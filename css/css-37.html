<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Sidebar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
        }

        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #111827;
            padding: 25px 15px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #2563eb;
            color: white;
        }

        .content {
            flex: 1;
            padding: 40px;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 170px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            SaaSApp
        </div>

        <a href="#">Dashboard</a>
        <a href="#">Analytics</a>
        <a href="#">Projects</a>
        <a href="#">Messages</a>
        <a href="#">Settings</a>

    </aside>

    <main class="content">

        <h1>Dashboard</h1>

        <p>
            This is a SaaS sidebar navigation layout.
        </p>

    </main>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
