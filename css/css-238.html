<!DOCTYPE html>
<html>

<head>
    <title>AI Notification Center</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .center {
            max-width: 700px;
            margin: auto
        }

        .notification {
            background: white;
            padding: 20px;
            margin: 12px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd
        }

        .ai {
            border-left: 5px solid #7c3aed
        }
    </style>
</head>

<body>
    <div class="center">
        <h1>AI Notification Center</h1>
        <div class="notification ai">
            <h3>🤖 AI Insight</h3>
            <p>Revenue increased by 18% this month.</p>
        </div>
        <div class="notification">
            <h3>New Report</h3>
            <p>Your analytics report is ready.</p>
        </div>
        <div class="notification">
            <h3>System Update</h3>
            <p>Your dashboard has been updated.</p>
        </div>
    </div>
</body>

</html>
