<!DOCTYPE html>
<html>

<head>
    <title>User Profile Menu</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 50px
        }

        .profile {
            width: 300px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px #ddd
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px
        }

        .menu a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: #333;
            border-top: 1px solid #eee
        }
    </style>
</head>

<body>
    <div class="profile">
        <div class="avatar">MR</div>
        <h2>Manvitha Rai</h2>
        <p>Software Developer</p>
        <div class="menu">
            <a href="#">Profile</a>
            <a href="#">Settings</a>
            <a href="#">Billing</a>
            <a href="#">Logout</a>
        </div>
    </div>
</body>

</html>
