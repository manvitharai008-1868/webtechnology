<!DOCTYPE html>
<html>

<head>
    <title>SaaS Signup</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .form {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="form">
        <h1>Create Account</h1>
        <input placeholder="Full Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Create Account</button>
    </div>
</body>

</html>
