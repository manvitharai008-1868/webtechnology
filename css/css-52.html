<!DOCTYPE html>
<html>

<head>
    <title>KPI Metric Card</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f5f5f5;
        }

        .kpi {
            width: 280px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
        }

        .change {
            color: green;
        }
    </style>
</head>

<body>

    <div class="kpi">

        <h3>Monthly Revenue</h3>

        <div class="value">₹2,50,000</div>

        <p class="change">↑ 15% from last month</p>

    </div>

</body>

</html>
