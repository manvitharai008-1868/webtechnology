<!DOCTYPE html>
<html>

<head>
    <title>Responsive Signup</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .signup {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box
        }

        button {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="signup">
        <h1>Create Account</h1>
        <input type="text" placeholder="Full Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <input type="password" placeholder="Confirm Password">
        <button>Sign Up</button>
    </div>
</body>

</html>
