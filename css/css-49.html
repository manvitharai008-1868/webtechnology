<!DOCTYPE html>
<html>

<head>
    <title>Feature Card</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .feature {
            width: 300px;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .icon {
            font-size: 40px;
        }

        .feature h2 {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="feature">

        <div class="icon">⚡</div>

        <h2>Fast Performance</h2>

        <p>
            Our platform provides fast and reliable performance
            for everyday tasks.
        </p>

    </div>

</body>

</html>
