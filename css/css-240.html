<!DOCTYPE html>
<html>

<head>
    <title>SaaS Onboarding</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 40px
        }

        .steps {
            max-width: 800px;
            margin: auto;
            display: flex;
            gap: 10px
        }

        .step {
            flex: 1;
            padding: 20px;
            background: white;
            text-align: center;
            border-radius: 10px
        }

        .active {
            background: #2563eb;
            color: white
        }
    </style>
</head>

<body>
    <h1 style="text-align:center">Get Started</h1>
    <div class="steps">
        <div class="step active">1<br>Account</div>
        <div class="step">2<br>Profile</div>
        <div class="step">3<br>Preferences</div>
        <div class="step">4<br>Complete</div>
    </div>
</body>

</html>
