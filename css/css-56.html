<!DOCTYPE html>
<html>

<head>
    <title>Testimonial Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .testimonial {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ddd;
        }

        .quote {
            font-size: 18px;
            line-height: 1.6;
        }

        .author {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="testimonial">

        <p class="quote">
            "This platform made our work easier and helped
            our team become more productive."
        </p>

        <p class="author">— Priya Sharma</p>

        <small>Software Developer</small>

    </div>

</body>

</html>
