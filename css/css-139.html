<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 138 - AI Report Generator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 25px;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        textarea {
            height: 100px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .report {
            margin-top: 25px;
            background: #f5f5f5;
            padding: 25px;
            border-radius: 10px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="panel">

            <h1>AI Report Generator</h1>

            <label>Report Title</label>
            <input type="text" placeholder="Enter report title">

            <label>Instructions</label>
            <textarea placeholder="Describe the report..."></textarea>

            <button>Generate Report</button>

            <div class="report">

                <h2>Generated Report</h2>

                <p>
                    This report contains an AI-generated analysis based
                    on the information and instructions provided.
                </p>

            </div>

        </div>

    </div>

</body>

</html>
