<!DOCTYPE html>
<html>

<head>
    <title>Analytics Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #222;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #0002;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Analytics Dashboard</h1>

    <div class="dashboard">
        <div class="card">
            <h3>Visitors</h3>
            <div class="number">24,860</div>
            <p>+12.4%</p>
        </div>

        <div class="card">
            <h3>Sessions</h3>
            <div class="number">18,420</div>
            <p>+8.1%</p>
        </div>

        <div class="card">
            <h3>Conversion</h3>
            <div class="number">7.8%</div>
            <p>+1.3%</p>
        </div>

        <div class="card">
            <h3>Revenue</h3>
            <div class="number">₹4.82L</div>
            <p>+15.2%</p>
        </div>
    </div>

</body>

</html>
