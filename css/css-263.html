<!DOCTYPE html>
<html>

<head>
    <title>SaaS Checkout</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px
        }

        .checkout {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box
        }

        .summary {
            background: #f8fafc;
            padding: 20px;
            margin: 20px 0
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="checkout">
        <h1>Checkout</h1>
        <div class="summary">
            <h3>Professional Plan</h3>
            <p>Monthly subscription: ₹999</p>
            <p>Tax: ₹180</p>
            <h2>Total: ₹1179</h2>
        </div>
        <input placeholder="Card Holder Name">
        <input placeholder="Card Number">
        <input placeholder="Expiry Date">
        <input placeholder="CVV">
        <button>Complete Payment</button>
    </div>
</body>

</html>
