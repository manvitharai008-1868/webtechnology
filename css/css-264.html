<!DOCTYPE html>
<html>

<head>
    <title>Invoice Management</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .container {
            max-width: 900px;
            margin: auto
        }

        .invoice {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between
        }

        button {
            padding: 8px 15px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Invoice Management</h1>
        <div class="invoice">
            <div>
                <h3>Invoice #1001</h3>
                <p>₹999 · Paid</p>
            </div><button>View</button>
        </div>
        <div class="invoice">
            <div>
                <h3>Invoice #1002</h3>
                <p>₹1499 · Pending</p>
            </div><button>Pay</button>
        </div>
        <div class="invoice">
            <div>
                <h3>Invoice #1003</h3>
                <p>₹799 · Paid</p>
            </div><button>View</button>
        </div>
    </div>
</body>

</html>
