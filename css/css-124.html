<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 124 - AI Response Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .card {
            max-width: 700px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ddd;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .badge {
            background: #eee;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .response {
            margin-top: 20px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="header">
            <h2>AI Response</h2>
            <span class="badge">AI Generated</span>
        </div>

        <div class="response">
            <p>
                Artificial Intelligence is a technology that enables computers
                to perform tasks such as learning, reasoning and problem solving.
            </p>
        </div>

    </div>

</body>

</html>
