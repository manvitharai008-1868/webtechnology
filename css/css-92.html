<!DOCTYPE html>
<html>

<head>
    <title>KPI Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 30px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .kpi {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #0002;
        }

        .kpi h2 {
            color: #4f46e5;
            font-size: 30px;
        }

        @media(max-width:700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>KPI Analytics Dashboard</h1>

    <div class="dashboard">

        <div class="kpi">
            <h3>Monthly Revenue</h3>
            <h2>₹8.4L</h2>
            <p>+14%</p>
        </div>

        <div class="kpi">
            <h3>ARPU</h3>
            <h2>₹1,240</h2>
            <p>Average Revenue/User</p>
        </div>

        <div class="kpi">
            <h3>Churn</h3>
            <h2>2.8%</h2>
            <p>Monthly</p>
        </div>

        <div class="kpi">
            <h3>LTV</h3>
            <h2>₹18,500</h2>
            <p>Customer Lifetime Value</p>
        </div>

    </div>

</body>

</html>
