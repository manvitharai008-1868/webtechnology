<!DOCTYPE html>
<html>

<head>
    <title>SaaS Login</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 30px
        }

        .login {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            box-sizing: border-box
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <div class="login">
        <h1>Welcome Back</h1>
        <p>Login to your SaaS account.</p>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>
</body>

</html>
