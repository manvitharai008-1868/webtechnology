<!DOCTYPE html>
<html>

<head>
    <title>Help and Support</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .container {
            max-width: 900px;
            margin: auto
        }

        .search {
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>How can we help?</h1>
        <input class="search" placeholder="Search help articles...">
        <div class="grid">
            <div class="card">
                <h2>Getting Started</h2>
                <p>Learn the basics.</p>
            </div>
            <div class="card">
                <h2>Account</h2>
                <p>Manage your account.</p>
            </div>
            <div class="card">
                <h2>Billing</h2>
                <p>Payment and invoices.</p>
            </div>
        </div>
    </div>
</body>

</html>
