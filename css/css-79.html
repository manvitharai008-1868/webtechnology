<!DOCTYPE html>
<html>

<head>
    <title>Progress Stepper</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .active {
            background: #2563eb;
            color: white;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #ddd;
        }
    </style>
</head>

<body>

    <h2>Progress Stepper</h2>

    <div class="stepper">

        <div class="step active">1</div>

        <div class="line"></div>

        <div class="step active">2</div>

        <div class="line"></div>

        <div class="step">3</div>

        <div class="line"></div>

        <div class="step">4</div>

    </div>

</body>

</html>
