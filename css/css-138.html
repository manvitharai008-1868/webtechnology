<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 137 - Text to Chart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .input-box,
        .chart {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px #ddd;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .bars {
            display: flex;
            align-items: end;
            gap: 25px;
            height: 220px;
            padding: 20px;
        }

        .bar {
            width: 60px;
            background: #777;
            text-align: center;
            color: white;
            padding-top: 8px;
        }

        .bar1 {
            height: 80px;
        }

        .bar2 {
            height: 140px;
        }

        .bar3 {
            height: 110px;
        }

        .bar4 {
            height: 180px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="input-box">

            <h1>Text-to-Chart Analytics</h1>

            <textarea placeholder="Describe the chart you want..."></textarea>

            <button>Generate Chart</button>

        </div>

        <div class="chart">

            <h2>Generated Chart</h2>

            <div class="bars">
                <div class="bar bar1">A</div>
                <div class="bar bar2">B</div>
                <div class="bar bar3">C</div>
                <div class="bar bar4">D</div>
            </div>

        </div>

    </div>

</body>

</html>
