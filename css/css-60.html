<!DOCTYPE html>
<html>

<head>
    <title>Icon and Action Buttons</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .icon-button {
            width: 45px;
            height: 45px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            margin: 5px;
        }

        .action-button {
            padding: 12px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h2>Icon Buttons</h2>

    <button class="icon-button">❤️</button>
    <button class="icon-button">🔔</button>
    <button class="icon-button">⚙️</button>

    <h2>Action Buttons</h2>

    <button class="action-button">Save</button>
    <button class="action-button">Edit</button>
    <button class="action-button">Share</button>

</body>

</html>
