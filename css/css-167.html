<!DOCTYPE html>
<html>

<head>
    <title>ML Probability Score</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .score {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .number {
            font-size: 55px;
            font-weight: bold;
        }

        .bar {
            height: 20px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .fill {
            width: 82%;
            height: 100%;
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div class="score">
        <h1>Probability Score</h1>

        <div class="number">82%</div>

        <div class="bar">
            <div class="fill"></div>
        </div>

        <p>Prediction Probability</p>
    </div>

</body>

</html>
