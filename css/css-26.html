<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Outline</title>

    <style>
        .box {
            width: 250px;
            padding: 30px;
            margin: 40px;

            border: 3px solid blue;

            outline: 5px dashed red;
            outline-offset: 10px;

            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>CSS Outline</h1>

    <div class="box">
        This box demonstrates outline and outline-offset.
    </div>

</body>

</html>
