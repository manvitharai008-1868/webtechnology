<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 128 - AI Insight Card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .card {
            max-width: 650px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            border-left: 5px solid #333;
            box-shadow: 0 4px 15px #ddd;
        }

        .title {
            display: flex;
            justify-content: space-between;
        }

        .insight {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="title">
            <h2>AI Insight</h2>
            <span>✨</span>
        </div>

        <div class="insight">
            <strong>Key Insight:</strong>
            <p>
                Website performance can improve when images are optimized
                and unnecessary resources are reduced.
            </p>
        </div>

    </div>

</body>

</html>
