<!DOCTYPE html>
<html>

<head>
    <title>Team Workspace</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px
        }

        .workspace {
            max-width: 1000px;
            margin: auto
        }

        .team {
            display: flex;
            gap: 15px;
            flex-wrap: wrap
        }

        .member {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px
        }

        .avatar {
            font-size: 35px
        }
    </style>
</head>

<body>
    <div class="workspace">
        <h1>Team Workspace</h1>
        <p>Collaborate with your team.</p>
        <div class="team">
            <div class="member">
                <div class="avatar">👩</div>
                <h3>Sarah</h3>
                <p>Designer</p>
            </div>
            <div class="member">
                <div class="avatar">👨</div>
                <h3>Alex</h3>
                <p>Developer</p>
            </div>
            <div class="member">
                <div class="avatar">👩</div>
                <h3>Priya</h3>
                <p>Manager</p>
            </div>
        </div>
    </div>
</body>

</html>
