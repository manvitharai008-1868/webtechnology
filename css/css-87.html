<!DOCTYPE html>
<html>

<head>
    <title>Multi-Step Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .form {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .step {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .active {
            background: #2563eb;
            color: white;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="form">

        <div class="steps">
            <div class="step active">1</div>
            <div class="step">2</div>
            <div class="step">3</div>
        </div>

        <h2>Personal Details</h2>

        <input type="text" placeholder="Full Name">

        <input type="email" placeholder="Email">

        <button>Next</button>

    </div>

</body>

</html>
