<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 2D Transformations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .box {
            width: 150px;
            height: 100px;
            background: lightblue;
            margin: 30px;
            padding: 20px;
            transition: 0.5s;
        }

        .rotate:hover {
            transform: rotate(20deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .translate:hover {
            transform: translate(50px, 20px);
        }

        .skew:hover {
            transform: skew(15deg, 10deg);
        }
    </style>
</head>

<body>

    <h1>CSS 2D Transformations</h1>

    <div class="box rotate">
        Rotate
    </div>

    <div class="box scale">
        Scale
    </div>

    <div class="box translate">
        Translate
    </div>

    <div class="box skew">
        Skew
    </div>

    <p>Hover over each box.</p>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
