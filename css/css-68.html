<!DOCTYPE html>
<html>

<head>
    <title>Modal Dialog</title>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
        }

        .modal {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px #aaa;
        }

        .modal button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="modal">

        <h2>Welcome!</h2>

        <p>This is a modal dialog component.</p>

        <button>Close</button>

    </div>

</body>

</html>
