<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .percentage {
            width: 70%;
            height: 100px;
            background: lightblue;
            padding: 20px;
        }

        .viewport {
            width: 50vw;
            height: 20vh;
            background: lightgreen;
            padding: 20px;
            margin-top: 20px;
        }

        .rem-box {
            width: 20rem;
            height: 8rem;
            background: orange;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Width and Height Units</h1>

    <div class="percentage">
        Width: 70%
    </div>

    <div class="viewport">
        Width: 50vw and Height: 20vh
    </div>

    <div class="rem-box">
        Width and Height using rem
    </div>

    <br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
