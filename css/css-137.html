<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 136 - Ask Your Data</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="panel">

            <h1>Ask Your Data</h1>

            <p>Ask questions about your dataset.</p>

            <textarea placeholder="Example: What were the total sales last month?"></textarea>

            <button>Analyze Data</button>

            <div class="answer">

                <h2>Result</h2>

                <p>
                    Your data analysis result will appear here.
                </p>

            </div>

        </div>

    </div>

</body>

</html>
