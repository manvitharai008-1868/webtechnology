<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Colors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .text-color {
            color: blue;
        }

        .background-color {
            background-color: lightgreen;
            padding: 20px;
        }

        .border-color {
            border: 4px solid red;
            padding: 20px;
        }

        .ui-element {
            background-color: purple;
            color: white;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1 class="text-color">CSS Colors</h1>

    <p class="background-color">
        This element has a background color.
    </p>

    <div class="border-color">
        This element has a colored border.
    </div>

    <br>

    <button class="ui-element">
        Click Me
    </button>

    <br><br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
