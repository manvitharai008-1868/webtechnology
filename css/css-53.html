<!DOCTYPE html>
<html>

<head>
    <title>Dashboard Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .dashboard {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd;
        }

        .items {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h2>Dashboard</h2>

        <div class="items">
            <span>Users</span>
            <b>1,250</b>
        </div>

        <div class="items">
            <span>Orders</span>
            <b>560</b>
        </div>

        <div class="items">
            <span>Revenue</span>
            <b>₹85,000</b>
        </div>

    </div>

</body>

</html>
