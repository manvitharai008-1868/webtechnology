<!DOCTYPE html>
<html>

<head>
    <title>SaaS Integrations</title>
    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px
        }

        .integrations {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px
        }

        @media(max-width:700px) {
            .integrations {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <h1>Integrations</h1>
    <div class="integrations">
        <div class="card">
            <h2>Google Drive</h2>
            <p>Cloud storage</p><button>Connect</button>
        </div>
        <div class="card">
            <h2>Slack</h2>
            <p>Communication</p><button>Connect</button>
        </div>
        <div class="card">
            <h2>GitHub</h2>
            <p>Development</p><button>Connect</button>
        </div>
    </div>
</body>

</html>
