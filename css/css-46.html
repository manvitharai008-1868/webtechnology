<!DOCTYPE html>
<html>

<head>
    <title>SaaS Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .card {
            width: 300px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd;
        }

        .card h2 {
            margin-top: 0;
        }

        .card button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>SaaS Platform</h2>
        <p>Manage your business easily using our platform.</p>
        <button>Get Started</button>
    </div>

</body>

</html>
