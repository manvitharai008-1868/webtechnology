<!DOCTYPE html>
<html>

<head>
    <title>ML Model Metrics</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .metric {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        .bar {
            height: 15px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            background: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>ML Model Metrics</h1>

        <div class="metric">
            <h3>Accuracy - 94%</h3>
            <div class="bar">
                <div class="fill" style="width:94%"></div>
            </div>
        </div>

        <div class="metric">
            <h3>Precision - 91%</h3>
            <div class="bar">
                <div class="fill" style="width:91%"></div>
            </div>
        </div>

        <div class="metric">
            <h3>Recall - 88%</h3>
            <div class="bar">
                <div class="fill" style="width:88%"></div>
            </div>
        </div>

    </div>

</body>

</html>
