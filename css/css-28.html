<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        html {
            font-size: 16px;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .percentage {
            width: 80%;
            background: lightblue;
            padding: 10px;
        }

        .em {
            font-size: 2em;
            background: lightgreen;
            padding: 1em;
        }

        .rem {
            font-size: 2rem;
            background: lightyellow;
            padding: 1rem;
        }

        .vw {
            font-size: 5vw;
        }

        .vh {
            height: 20vh;
            background: pink;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Measurement Units</h1>

    <div class="percentage">
        Percentage Unit
    </div>

    <br>

    <div class="em">
        EM Unit
    </div>

    <br>

    <div class="rem">
        REM Unit
    </div>

    <h2 class="vw">
        VW Unit
    </h2>

    <div class="vh">
        VH Unit
    </div>

    <br>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
