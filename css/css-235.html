<!DOCTYPE html>
<html>

<head>
    <title>Glassmorphism SaaS</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 50px
        }

        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap
        }

        .card {
            width: 250px;
            padding: 30px;
            color: white;
            background: rgba(255, 255, 255, .2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 20px
        }
    </style>
</head>

<body>
    <h1 style="color:white;text-align:center">Glass SaaS UI</h1>
    <div class="container">
        <div class="card">
            <h2>Analytics</h2>
            <p>View your analytics.</p>
        </div>
        <div class="card">
            <h2>Reports</h2>
            <p>Create reports.</p>
        </div>
        <div class="card">
            <h2>Team</h2>
            <p>Manage your team.</p>
        </div>
    </div>
</body>

</html>
