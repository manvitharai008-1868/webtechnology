<!DOCTYPE html>
<html>

<head>
    <title>API Key Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .key {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        code {
            display: block;
            background: #111827;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin: 10px 0;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>API Key Management</h1>

        <div class="key">
            <h3>Production API Key</h3>

            <code>sk_test_************************</code>

            <button>Copy Key</button>
            <button>Regenerate</button>
        </div>

        <div class="key">
            <h3>Development API Key</h3>

            <code>sk_dev_************************</code>

            <button>Copy Key</button>
            <button>Regenerate</button>
        </div>

    </div>

</body>

</html>
