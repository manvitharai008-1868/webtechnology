<!DOCTYPE html>
<html>

<head>
    <title>Account Settings</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fa;
            padding: 30px;
        }

        .settings {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="settings">

        <h1>Account Settings</h1>

        <label>Email</label>
        <input type="email" value="user@example.com">

        <label>Username</label>
        <input type="text" value="student123">

        <label>Phone</label>
        <input type="tel" value="+91 9876543210">

        <button>Save Changes</button>

    </div>

</body>

</html>
