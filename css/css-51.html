<!DOCTYPE html>
<html>

<head>
    <title>SaaS Statistics Card</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 40px;
        }

        .stats {
            width: 250px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px #ddd;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
        }

        .increase {
            color: green;
        }
    </style>
</head>

<body>

    <div class="stats">

        <h3>Total Users</h3>

        <div class="number">12,540</div>

        <p class="increase">↑ 12.5% this month</p>

    </div>

</body>

</html>
