<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Navigation Bar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        nav {
            background: #111827;
            padding: 15px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            gap: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }

        .links a:hover {
            color: #60a5fa;
        }

        .button {
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .links {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            SaaSApp
        </div>

        <div class="links">

            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">About</a>

        </div>

        <a href="#" class="button">
            Get Started
        </a>

    </nav>

    <main style="padding:40px; text-align:center;">
        <h1>SaaS Dashboard</h1>
        <p>Welcome to our SaaS application.</p>
    </main>

    <a href="index.html">Back to CSS Programs</a> |
    <a href="../index.html">Home</a>

</body>

</html>
